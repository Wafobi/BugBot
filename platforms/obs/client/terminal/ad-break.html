<title>Ad Break</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!--
  Parameters (all optional), same convention as bugbot's bars.html/chat.html:

    token=   the bot's OVERLAY_TOKEN. Without it, the bar stays at 0% - see
             connect() below, same listener as ../../../features/overlay/client/bars.html.
    host=    default 127.0.0.1 - the tunnel ends here, not at the server
    port=    default 4457
    theme=   load themes/<name>.css - see themes/README.md
    demo=1   the old simulated bar, no connection - for judging the layout
             without a bot running / without waiting for a real ad break

  The bar itself tracks features/overlay's ad_break_started_at/ad_break_seconds (state/patch
  frames on the same socket bars.html reads its numbers from) - it is Twitch's own ad
  duration, not the few extra seconds platforms/obs keeps this source visible afterwards, so
  the bar reaching 100% and sitting there briefly before OBS hides the source again is
  expected, not a bug.
-->

<style>
  /*
    Same terminal system as stream-boot.html, slimmed down to just the two
    things asked for: a terminal prompt line and a loading bar. No log, no
    titlebar, no icon — meant to sit small and quiet during an ad break.
    Page background is transparent on purpose (OBS Browser Source).
  */

  :root {
    --ink: #15100a;
    --ink-deep: #0d0904;
    --ink-line: #2a1f10;
    --amber: #ffb000;
    --amber-soft: #d99a3d;
    --amber-dim: #8a6a34;
    --glow: rgba(255, 176, 0, 0.35);
    --font-display: "VT323", ui-monospace, "Courier New", monospace;
    --font-body: "IBM Plex Mono", ui-monospace, "SFMono-Regular", "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent; /* deliberate: OBS Browser Source needs a see-through page */
  }

  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 90px;
    min-height: 100vh;
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  @keyframes blink { 50% { opacity: .15; } }

  .crt {
    position: relative;
    width: min(460px, 90vw);
    background: linear-gradient(180deg, var(--ink) 0%, var(--ink-deep) 100%);
    border: 1px solid var(--ink-line);
    border-radius: 6px;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.4),
      0 20px 60px rgba(0, 0, 0, 0.55),
      0 0 40px var(--glow);
    overflow: hidden;
  }

  .screen { position: relative; padding: 22px 24px; }
  .screen::before {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg, rgba(255,176,0,.05) 0px, rgba(255,176,0,.05) 1px, transparent 1px, transparent 3px
    );
    mix-blend-mode: overlay;
    z-index: 3;
  }
  .screen::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 60px rgba(0,0,0,.65);
    z-index: 3;
  }

  .body-stack { display: flex; flex-direction: column; gap: 16px; }

  .prompt { font-size: 13px; color: var(--amber-soft); }
  .prompt .cursor {
    display: inline-block;
    width: 8px; height: 14px;
    background: var(--amber);
    vertical-align: -2px;
    margin-left: 2px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .prompt .cursor { animation: blink 1s steps(1) infinite; }
  }

  .caption {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: .08em;
    color: var(--amber-soft);
    text-transform: uppercase;
  }

  .bar-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 8px;
    font-size: 12px; color: var(--amber-soft);
    font-variant-numeric: tabular-nums;
  }
  .bar-row .pct { font-family: var(--font-display); font-size: 22px; color: var(--amber); }

  .bar {
    height: 18px;
    border-radius: 5px;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--ink-line);
    overflow: hidden;
  }
  .bar-fill {
    position: relative;
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--amber-dim), var(--amber));
    box-shadow: 0 0 10px var(--glow);
    transition: width .5s ease;
    overflow: hidden;
  }
  .bar-fill::after {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      45deg,
      rgba(0,0,0,.18) 0px, rgba(0,0,0,.18) 8px,
      transparent 8px, transparent 16px
    );
    background-size: 200% 100%;
  }
  @media (prefers-reduced-motion: no-preference) {
    .bar-fill::after { animation: shimmer 1.1s linear infinite; }
  }
  @keyframes shimmer { from { background-position: 0 0; } to { background-position: -32px 0; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }
</style>

<!-- ?theme=<name> loads themes/<name>.css - the same file stream-boot.html and
     stream-pause.html in this folder load for the same ?theme=. See themes/README.md. -->
<script>
(function () {
  var theme = new URLSearchParams(location.search).get("theme");
  if (!theme) return;
  var link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = "themes/" + encodeURIComponent(theme) + ".css";
  document.currentScript.insertAdjacentElement("afterend", link);
})();
</script>

<div class="crt">
  <div class="screen">
    <div class="body-stack">
      <div class="prompt">wafobitv@twich.tv:~$ ./ad_break.sh --status<span class="cursor"></span></div>
      <div class="caption">Werbepause</div>
      <div>
        <div class="bar-row">
          <span id="spinnerLabel">⠋ puffere Geduld …</span>
          <span class="pct" id="pct">0%</span>
        </div>
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var frames = ["⠇","⠏","⠟","⠿","⠾","⠼","⠸","⠰","⠠","⠀"];
  var fIdx = 0;
  var spinnerLabel = document.getElementById("spinnerLabel");

  var messages = [
    "puffere Geduld …",
    "lade Werbe-Karma …",
    "kompiliere Ausreden …",
    "leere den Cache der Erwartungen …",
    "berechne Sinn der Werbung …",
    "warte auf Sponsoren-Segen …",
    "defragmentiere Nerven …",
    "sammle Selbstbeherrschung …",
    "rendere Geduldsfaden …",
    "synce mit dem Universum …",
    "lade Popcorn nach …",
    "installiere Zen-Modus …",
    "buffer overflow: Vorfreude",
    "skip-Button wird gesucht … 404"
  ];
  var queue = [];
  var lastLabel = null;
  var label = messages[0];

  function refillQueue() {
    var shuffled = messages.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
    }
    if (lastLabel && shuffled[0] === lastLabel && shuffled.length > 1) {
      var k = 1 + Math.floor(Math.random() * (shuffled.length - 1));
      var t = shuffled[0]; shuffled[0] = shuffled[k]; shuffled[k] = t;
    }
    queue = queue.concat(shuffled);
  }

  function nextLabel() {
    if (queue.length === 0) refillQueue();
    lastLabel = queue.shift();
    return lastLabel;
  }

  if (!reduceMotion) {
    setInterval(function () {
      fIdx = (fIdx + 1) % frames.length;
      spinnerLabel.textContent = frames[fIdx] + " " + label;
    }, 100);
    (function rotateLabel() {
      label = nextLabel();
      setTimeout(rotateLabel, 2400 + Math.random() * 1400);
    })();
  } else {
    spinnerLabel.textContent = "⠇ " + messages[0];
  }

  var barFill = document.getElementById("barFill");
  var pct = document.getElementById("pct");

  function setBar(percent) {
    var shown = Math.round(Math.max(0, Math.min(100, percent)));
    barFill.style.width = shown + "%";
    pct.textContent = shown + "%";
  }

  // --- Demo: the old simulated bar, no connection - for judging the layout ---------------
  function startDemoBar() {
    var current = 4;
    function stepBar() {
      var target = 94 + Math.random() * 5;
      if (Math.random() < 0.12) target = 70 + Math.random() * 15;
      current += (target - current) * 0.35;
      setBar(current);
      setTimeout(stepBar, 700 + Math.random() * 500);
    }
    stepBar();
  }

  // --- Real connection: features/overlay's ad_break_started_at/ad_break_seconds, on the
  // same socket bars.html reads its numbers from - a percentage is computed locally from
  // those two on a short interval, the same way bars.html computes uptime from started_at
  // rather than being pushed a number every second. ----------------------------------------
  var adBreak = { startedAt: null, seconds: 0 };

  function renderBar() {
    if (!adBreak.startedAt || !adBreak.seconds) { setBar(0); return; }
    var elapsed = Date.now() / 1000 - adBreak.startedAt;
    setBar((elapsed / adBreak.seconds) * 100);
  }

  function connect() {
    var token = params.get("token") || "";
    var host = params.get("host") || "127.0.0.1";
    var port = params.get("port") || "4457";
    if (!token) { console.warn("Kein ?token= in der URL - keine Verbindung."); return; }

    var socket = new WebSocket("ws://" + host + ":" + port + "/?token=" + encodeURIComponent(token));
    socket.onclose = function () { setTimeout(connect, 3000); };
    socket.onerror = function () { socket.close(); };
    socket.onmessage = function (message) {
      var frame;
      try { frame = JSON.parse(message.data); } catch (e) { return; }
      var data = frame.data || {};
      if (frame.type === "state") {
        adBreak.startedAt = data.ad_break_started_at || null;
        adBreak.seconds = data.ad_break_seconds || 0;
      } else if (frame.type === "patch") {
        if ("ad_break_started_at" in data) adBreak.startedAt = data.ad_break_started_at;
        if ("ad_break_seconds" in data) adBreak.seconds = data.ad_break_seconds;
      }
      // "history"/"message"/"clear" - chat.html's half of the same socket - ignored here.
    };
  }

  if (params.get("demo") === "1") { startDemoBar(); } else { setBar(0); connect(); setInterval(renderBar, 200); }
})();
</script>
