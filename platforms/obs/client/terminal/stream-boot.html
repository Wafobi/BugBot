<title>Stream Boot</title>

<!--
  Parameters (all optional), same convention as bugbot's bars.html/chat.html:

    token=   the bot's OVERLAY_TOKEN. Without it, the page sits in its quiet
             standby look forever - rain, CRT flicker, nothing else - since
             it has no "live" to wait for. See the boot gate below.
    host=    default 127.0.0.1 - the tunnel ends here, not at the server
    port=    default 4457
    source=  which chat platform(s) get mixed into the log, comma-separated:
             source=twitch or source=twitch,discord. Empty = everything the
             bot sends (default) - see window.__bootChat below
    theme=   load themes/<name>.css - see themes/README.md
    demo=1   the same sequence and timing as the real thing, just without a
             bot to wait on - for judging the layout, chat mixing included
             (sample messages, see DEMO_CHAT below, not ?source= filtered)

  The boot sequence (log lines, chime/blips, progress bar, ambient glitches) does not start
  on page load: it waits for features/overlay's "live" to turn true (or ?demo=1), then three
  seconds of just the blinking cursor, then the command after the shell prompt types itself
  out - keystroke sounds, the occasional typo (backspaced and corrected) - and fire()s the
  rest right after that finishes, not on a fixed timer running in parallel that could land
  either side of it. See window.__bootGate below, which every script that makes sound or
  shows a message waits on, and startPrompt() for the typing. Real chat mixes into the log
  alongside the simulated lines once the gate has fired (pink "CHAT" tag) - see
  window.__bootChat and the WebSocket in the boot gate script. The matrix rain and the CRT's
  own flicker are not gated - those are the idle/standby look, not "booting", and keep
  running regardless of connection state.
-->

<style>
  /*
    Design plan
    Color   ink #15100a / ink-deep #0d0904 (warm near-black terminal body),
            amber #ffb000 (phosphor primary), amber-soft #d99a3d, amber-dim #7a5a26,
            cyan #6fe7dd (info), green #7cffb2 (ok), red #ff5f6d (error/warn),
            pink #ff8fd6 (real chat, mixed into the log - see window.__bootChat)
    Type    VT323 for the hero line (authentic pixel-terminal face),
            IBM Plex Mono for log & prompt text (readable monospace, tabular figures)
    Layout  a single CRT terminal card showing a boot log: "getting ready to go
            live" status, an antenna icon, a scrolling log, and a connection-
            quality bar. Backed by a full-page amber matrix-rain canvas plus a
            radial vignette, so the page looks intentional when opened
            directly in a browser (not only pasted into OBS as a source).
  */

  :root {
    --ink: #15100a;
    --ink-deep: #0d0904;
    --ink-line: #2a1f10;
    --amber: #ffb000;
    --amber-soft: #d99a3d;
    --amber-dim: #8a6a34;
    --cyan: #6fe7dd;
    --green: #7cffb2;
    --red: #ff5f6d;
    --pink: #ff8fd6;
    --glow: rgba(255, 176, 0, 0.35);
    --font-display: "VT323", ui-monospace, "Courier New", monospace;
    --font-body: "IBM Plex Mono", ui-monospace, "SFMono-Regular", "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--ink-deep);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  #rain {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 0%, transparent 38%, rgba(13, 9, 4, 0.9) 100%);
  }

  @media (prefers-reduced-motion: no-preference) {
    .crt { animation: flicker 6.5s infinite steps(60); }
  }
  @keyframes flicker {
    0%, 96%, 100% { opacity: 1; }
    97% { opacity: 0.86; }
    98% { opacity: 1; }
    98.5% { opacity: 0.9; }
  }
  @keyframes blink { 50% { opacity: .15; } }

  .crt {
    position: relative;
    width: min(600px, 92vw);
    background: linear-gradient(180deg, var(--ink) 0%, var(--ink-deep) 100%);
    border: 1px solid var(--ink-line);
    border-radius: 6px;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.4),
      0 20px 60px rgba(0, 0, 0, 0.55),
      0 0 40px var(--glow);
    overflow: hidden;
  }

  @keyframes glitch-shift {
    0%   { transform: translate(0,0); filter: none; clip-path: none; }
    8%   { transform: translate(-5px, 1px); filter: hue-rotate(12deg) saturate(1.5); clip-path: inset(6% 0 78% 0); }
    18%  { transform: translate(4px, -2px); filter: hue-rotate(-10deg); clip-path: inset(62% 0 10% 0); }
    30%  { transform: translate(-3px, 0); clip-path: inset(30% 0 46% 0); filter: none; }
    42%  { transform: translate(3px, 1px); clip-path: inset(4% 0 88% 0); }
    55%  { transform: translate(-2px, -1px); clip-path: none; filter: hue-rotate(6deg); }
    100% { transform: translate(0,0); filter: none; clip-path: none; }
  }
  .crt.glitching { animation: glitch-shift 0.34s steps(1, end); }

  .glitch-slice {
    position: absolute;
    left: 0; right: 0;
    pointer-events: none;
    opacity: 0;
    mix-blend-mode: screen;
    transition: opacity .04s linear;
  }
  .glitch-slice.active { opacity: .85; }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: #1c140a;
    border-bottom: 1px solid var(--ink-line);
  }
  .dots { display: flex; gap: 6px; flex-shrink: 0; }
  .dots span {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--amber-dim);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.3);
  }
  .dots span:nth-child(1) { opacity: .55; }
  .dots span:nth-child(2) { opacity: .75; }
  .dots span:nth-child(3) { opacity: 1; background: var(--amber-soft); }
  .filename {
    flex: 1;
    font-size: 12px;
    color: var(--amber-dim);
    letter-spacing: .02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--amber);
    flex-shrink: 0;
  }
  .badge .pip {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 6px var(--amber);
  }
  @media (prefers-reduced-motion: no-preference) {
    .badge .pip { animation: blink 1.1s steps(1) infinite; }
  }

  .screen { position: relative; padding: 18px 20px 16px; }
  .screen::before {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg, rgba(255,176,0,.05) 0px, rgba(255,176,0,.05) 1px, transparent 1px, transparent 3px
    );
    mix-blend-mode: overlay;
    z-index: 3;
  }
  .screen::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 60px rgba(0,0,0,.65);
    z-index: 3;
  }

  .hero { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .icon-art {
    font-family: var(--font-body);
    font-size: 9px;
    line-height: 1.05;
    color: var(--amber);
    text-shadow: 0 0 6px var(--glow);
    white-space: pre;
    flex-shrink: 0;
  }
  @media (prefers-reduced-motion: no-preference) {
    .icon-art { animation: pulse 2.4s ease-in-out infinite; }
  }
  @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

  .hero-text h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(26px, 5.4vw, 38px);
    line-height: 1;
    letter-spacing: .03em;
    color: var(--amber);
    text-shadow: 0 0 10px var(--glow), 2px 0 0 rgba(111,231,221,.25), -2px 0 0 rgba(255,95,109,.15);
    text-wrap: balance;
  }
  .prompt { margin-top: 4px; font-size: 13px; color: var(--amber-soft); }
  .prompt .cursor {
    display: inline-block;
    width: 8px; height: 14px;
    background: var(--amber);
    vertical-align: -2px;
    margin-left: 2px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .prompt .cursor { animation: blink 1s steps(1) infinite; }
  }

  .log {
    height: 168px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 2px;
    padding: 10px 12px;
    background: rgba(0,0,0,.28);
    border: 1px solid var(--ink-line);
    border-radius: 3px;
    font-size: 12.5px;
    line-height: 1.55;
  }
  .log-line { display: flex; gap: 8px; white-space: nowrap; overflow: hidden; }
  .log-line .ts { color: var(--amber-dim); flex-shrink: 0; }
  .log-line .lvl {
    flex-shrink: 0; font-weight: 600; width: 58px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Usernames, unlike the fixed system labels (INFO/OK/...), have no predictable length -
     58px was fine for "DEBUG" but overlapped .msg the moment a name ran past it. Wider and
     flexible, with the same ellipsis as a backstop for the rare name that still doesn't
     fit. */
  .log-line .lvl.chat { width: auto; max-width: 150px; }
  .log-line .msg { color: #e9d9b8; overflow: hidden; text-overflow: ellipsis; }
  .lvl.info  { color: var(--cyan); }
  .lvl.ok    { color: var(--green); }
  .lvl.warn  { color: var(--amber); }
  .lvl.error { color: var(--red); }
  .lvl.debug { color: var(--amber-dim); }
  .lvl.chat  { color: var(--pink); }

  .progress { margin-top: 14px; font-size: 12px; color: var(--amber-soft); }
  .progress-row {
    display: flex; justify-content: space-between; margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
  }
  .bar {
    height: 7px; border-radius: 4px;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--ink-line);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--amber-dim), var(--amber));
    box-shadow: 0 0 8px var(--glow);
    transition: width .5s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }
</style>

<!-- ?theme=<name> loads themes/<name>.css - the same file ad-break.html and
     stream-pause.html in this folder load for the same ?theme=. See themes/README.md. -->
<script>
(function () {
  var theme = new URLSearchParams(location.search).get("theme");
  if (!theme) return;
  var link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = "themes/" + encodeURIComponent(theme) + ".css";
  document.currentScript.insertAdjacentElement("afterend", link);
})();
</script>

<!-- The boot gate: nothing that makes sound or shows a message runs until this fires.
     Every such script below registers with window.__bootGate.onReady() instead of starting
     itself directly. Fires once features/overlay first reports "live" (the same listener
     bars.html/chat.html use - see docs/overlay.md - or ?demo=1), PROMPT_START_DELAY_MS has
     passed, and the typed command in startPrompt() below has finished - see its onDone.
     Reconnecting mid-standby is harmless: the gate only ever fires once, so a
     dropped/restored connection cannot restart an already-running boot sequence. -->
<script>
(function () {
  var GATE_DELAY_MS = 5000;
  var PROMPT_START_DELAY_MS = 3000;
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var armed = [];
  var fired = false;
  window.__bootGate = {
    onReady: function (fn) { if (fired) fn(); else armed.push(fn); },
  };
  function fire() {
    if (fired) return;
    fired = true;
    document.getElementById("statusBadge").textContent = "LIVE";
    armed.forEach(function (fn) { fn(); });
    armed = [];
  }

  // --- The prompt, typed out - with the occasional typo, backspaced and corrected, same
  // way an actual person types. Starts PROMPT_START_DELAY_MS after "live" is first seen (or
  // after ?demo=1 loads) - a beat of just the blinking cursor first, same as someone
  // pausing before they start typing, rather than the cursor and the first keystroke
  // landing in the same instant. Not gated behind fire() itself: it is what fills the wait,
  // not part of what it leads to. window.__bootSound may not exist yet the instant this
  // starts (it is defined by a later script) - every call is guarded the same way addLine()
  // below guards its own sound calls. ---
  // Only the command types itself out - "wafobitv@twich.tv:~$ " is the shell's own prompt
  // (static markup, see below), never something a person types.
  var promptFull = "./stream_boot.sh --status";
  var TYPO_CHARS = "qwertzuiopasdfghjklyxcvbnm";
  var promptStarted = false;

  function playKey(backspace) {
    if (window.__bootSound) window.__bootSound.key(backspace);
  }

  // onDone fires fire() itself - the status flips to LIVE and the rest of the sequence
  // starts right after the line is cleanly finished (typo corrected, no half-typed
  // command), not on a fixed timer running in parallel that could land either side of it.
  function startPrompt(onDone) {
    if (promptStarted) return;
    promptStarted = true;
    if (window.__bootSound) window.__bootSound.bgm();
    // Looked up here, not cached at the top of this script: that runs before <div
    // class="crt"> further down the page even exists yet, and getElementById would just
    // return null. By the time anything actually calls startPrompt() - a WS message or a
    // demo timeout, both asynchronous - the whole document has long since parsed.
    var promptText = document.getElementById("promptText");
    if (reduceMotion) { promptText.textContent = promptFull; if (onDone) onDone(); return; }

    // Paced to use roughly the time budgeted for it (GATE_DELAY_MS minus the pause before
    // typing starts) rather than typing at a natural, much faster speed and finishing early
    // - the wait is the point, the prompt is what fills it. Typos cost extra time on top
    // (hold + backspace pause below), so the per-character delay is budgeted a bit under
    // the even split to leave room for a couple of them.
    var TYPE_BUDGET_MS = Math.max(1000, GATE_DELAY_MS - PROMPT_START_DELAY_MS);
    var CHAR_DELAY = (TYPE_BUDGET_MS * 0.85) / promptFull.length;

    // Real typing is not a metronome: short bursts, and every so often a beat where a
    // person's hands just aren't moving. A wide 0.4x-1.6x spread on every character plus an
    // occasional (1 in 8) longer hesitation on top of that reads far less mechanical than a
    // narrow band would.
    function nextCharDelay() {
      var delay = CHAR_DELAY * (0.4 + Math.random() * 1.2);
      if (Math.random() < 0.125) delay += CHAR_DELAY * (1.5 + Math.random() * 3);
      return delay;
    }

    var i = 0;
    function step() {
      if (i >= promptFull.length) {
        // A short settle before the badge flips and the rest kicks in - finishing a
        // command and the terminal reacting in the same instant reads as instantaneous,
        // not as one thing causing the other.
        if (onDone) setTimeout(onDone, 400 + Math.random() * 300);
        return;
      }
      var next = promptFull[i];
      // No typo on a space - backspacing across a word boundary reads as a stutter, not a
      // typo.
      if (next !== " " && Math.random() < 0.06) {
        var wrong = TYPO_CHARS[Math.floor(Math.random() * TYPO_CHARS.length)];
        promptText.textContent = promptFull.slice(0, i) + wrong;
        playKey(false);
        setTimeout(function () {
          promptText.textContent = promptFull.slice(0, i);
          playKey(true);
          setTimeout(function () {
            i++;
            promptText.textContent = promptFull.slice(0, i);
            playKey(false);
            setTimeout(step, nextCharDelay());
          }, CHAR_DELAY * (1.2 + Math.random()));
        }, CHAR_DELAY * (1.8 + Math.random() * 1.5));
        return;
      }
      i++;
      promptText.textContent = promptFull.slice(0, i);
      playKey(false);
      setTimeout(step, nextCharDelay());
    }
    step();
  }

  // Sample chat for ?demo=1, since there is no bot to pull real messages from - routed
  // through window.__bootChat exactly like the real thing (defined by the log-line script;
  // always ready by DOMContentLoaded, since that script runs unconditionally, not only once
  // a connection exists), so it exercises the same code path a real message would.
  var DEMO_CHAT = [
    { platform: "twitch", user_name: "Kevin", text: "moin moin! 👋" },
    { platform: "twitch", user_name: "ModDoro", text: "willkommen im Stream", is_privileged: true },
    { platform: "discord", user_name: "Lenaa", text: "das overlay sieht mega aus", is_subscriber: true },
    { platform: "twitch", user_name: "xX_Gamer_Xx", text: "wie heißt der boss nochmal?" },
    { platform: "twitch", user_name: "quantum_qwertz", text: "PogChamp" },
  ];
  function startDemoChat() {
    var i = 0;
    (function tick() {
      window.__bootChat.push(DEMO_CHAT[i % DEMO_CHAT.length]);
      i++;
      setTimeout(tick, 3000 + Math.random() * 4000);
    })();
  }

  // Everything below touches #statusBadge/#promptText, both further down the page than
  // this script - waiting for DOMContentLoaded is what makes calling fire()/startPrompt()
  // synchronously (the ?demo=1 branch) safe rather than a race against the parser.
  document.addEventListener("DOMContentLoaded", function () {
    var params = new URLSearchParams(location.search);
    if (params.get("demo") === "1") {
      // Same pacing as the real thing (three-second pause, typed command, fire() once it's
      // done) rather than firing instantly - now that fire() waits on the typing actually
      // finishing instead of a fixed timer, "instant" would just mean skipping the part
      // that is the point of the layout being previewed.
      setTimeout(function () { startPrompt(fire); }, PROMPT_START_DELAY_MS);
      startDemoChat();
      return;
    }

    var token = params.get("token") || "";
    if (!token) { console.warn("Kein ?token= in der URL - Boot-Sequenz startet nicht."); return; }
    var host = params.get("host") || "127.0.0.1";
    var port = params.get("port") || "4457";
    var sources = (params.get("source") || "")
      .split(",").map(function (s) { return s.trim().toLowerCase(); }).filter(Boolean);
    var live = false;
    var promptTimer = null;

    function connect() {
      var socket = new WebSocket("ws://" + host + ":" + port + "/?token=" + encodeURIComponent(token));
      socket.onclose = function () { setTimeout(connect, 3000); };
      socket.onerror = function () { socket.close(); };
      socket.onmessage = function (message) {
        var frame;
        try { frame = JSON.parse(message.data); } catch (e) { return; }
        if (frame.type === "message") {
          // Real chat, mixed into the boot log alongside the simulated lines - see
          // window.__bootChat in the log-line script below. Same listener as
          // ../../../../features/overlay/client/chat.html, same "history"/"message"/"clear"
          // frames; only "message" (live arrivals) is used here, not the backlog.
          var entry = frame.data || {};
          if (!sources.length || sources.indexOf((entry.platform || "").toLowerCase()) !== -1) {
            if (window.__bootChat) window.__bootChat.push(entry);
          }
          return;
        }
        if (frame.type !== "state" && frame.type !== "patch") return;
        var data = frame.data || {};
        if ("live" in data) live = !!data.live;
        if (live && !promptTimer) {
          promptTimer = setTimeout(function () { startPrompt(fire); }, PROMPT_START_DELAY_MS);
        }
      };
    }
    connect();
  });
})();
</script>

<canvas id="rain"></canvas>
<div class="vignette"></div>

<script>
(function () {
  var canvas = document.getElementById("rain");
  var ctx = canvas.getContext("2d");
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var chars = "01010101010101ABCDEF01010101░▒▓01".split("");
  var fontSize = 15;
  var columns, drops;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / fontSize);
    drops = new Array(columns).fill(0).map(function () { return Math.random() * -50; });
  }
  window.addEventListener("resize", resize);
  resize();

  // Read fresh every frame rather than once at startup: a ?theme= stylesheet (see the
  // loader above <canvas>) loads asynchronously even from file://, so caching these once
  // could still be reading the shipped amber before the theme finishes arriving. A
  // getComputedStyle() call sixteen times a second on one element costs nothing worth
  // avoiding.
  function themeColor(token, fallback) {
    var value = getComputedStyle(document.documentElement).getPropertyValue(token).trim();
    return value || fallback;
  }

  function draw() {
    var bg = themeColor("--ink-deep", "#0d0904");
    var bright = themeColor("--amber", "#ffb000");
    var dim = themeColor("--amber-dim", "#8a6a34");

    ctx.globalAlpha = 0.18;
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
    ctx.font = fontSize + "px 'IBM Plex Mono', monospace";
    for (var i = 0; i < columns; i++) {
      var char = chars[Math.floor(Math.random() * chars.length)];
      var x = i * fontSize;
      var y = drops[i] * fontSize;
      var hit = Math.random() < 0.05;
      ctx.globalAlpha = hit ? 0.9 : 0.35;
      ctx.fillStyle = hit ? bright : dim;
      ctx.fillText(char, x, y);
      if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
    ctx.globalAlpha = 1;
  }

  if (reduceMotion) {
    ctx.fillStyle = themeColor("--ink-deep", "#0d0904");
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else {
    setInterval(draw, 60);
  }
})();
</script>

<script>
(function () {
  /* Synthesized, royalty-free sci-fi terminal sound — no samples, no modem noises. */
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) {
    var noop = function () {};
    window.__bootSound = { blip: noop, ready: noop, glitch: noop, key: noop, plotter: noop, bgm: noop };
    return;
  }
  var ctx = new AudioCtx();

  function resume() { if (ctx.state === "suspended") ctx.resume(); }
  resume();
  ["click", "keydown", "pointerdown"].forEach(function (evt) {
    window.addEventListener(evt, resume, { once: true });
  });

  function tone(freq, start, duration, type, gainPeak) {
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || "square";
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(gainPeak || 0.08, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start);
    osc.stop(start + duration + 0.02);
  }

  function playKeyClick(backspace, quiet) {
    var t = ctx.currentTime;
    var bufferSize = Math.floor(ctx.sampleRate * 0.035);
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var filter = ctx.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = backspace ? 1400 : 2600;
    var gain = ctx.createGain();
    // Loud enough to actually read as a keystroke next to the rest of the boot sequence's
    // sounds (chime peaks around 0.05-0.08, the glitch zap 0.05) - a click this short needs
    // more headroom than a sustained tone to be perceived as anything at all.
    gain.gain.setValueAtTime(quiet ? 0.06 : 0.16, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(t);
  }

  // A stepper-motor "zip" rather than a keystroke click - a short square wave sliding down
  // in pitch, the way a pen plotter (or dot-matrix printer) sounds stepping across a line.
  // Used for the log lines below, not the prompt - that one is a person at a keyboard, this
  // is the machine printing its own output.
  function playPlotterTick() {
    // Filtered noise, not a tone: a repeated square-wave beep at this rate reads as an
    // alarm and wears thin fast. A noise burst has no fixed pitch for the ear to lock onto,
    // so it stays in the background the way an actual print head stepping across a line
    // would - random per tick, which is what keeps a fast, repetitive sound from grating.
    var t = ctx.currentTime;
    var bufferSize = Math.floor(ctx.sampleRate * 0.03);
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 850 + Math.random() * 900;
    filter.Q.value = 2.5 + Math.random() * 3.5;
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.03, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(t);
  }

  function playBootChime() {
    var t = ctx.currentTime + 0.05;
    var notes = [220, 277.18, 329.63, 440, 587.33];
    notes.forEach(function (f, i) {
      tone(f, t + i * 0.09, 0.16, "square", 0.05);
      tone(f * 2, t + i * 0.09, 0.12, "sine", 0.02);
    });
    var bufferSize = Math.floor(ctx.sampleRate * 0.5);
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 1200;
    var noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.03, t);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    noise.connect(filter).connect(noiseGain).connect(ctx.destination);
    noise.start(t);
  }

  var blipFreq = { info: 1046.5, ok: 1318.5, warn: 392, debug: 660, error: 220 };
  function playBlip(level) {
    var t = ctx.currentTime;
    var wave = (level === "warn" || level === "error") ? "sawtooth" : "square";
    var dur = level === "error" ? 0.18 : 0.06;
    var peak = level === "debug" ? 0.01 : 0.025;
    tone(blipFreq[level] || 800, t, dur, wave, peak);
  }

  function playReadyChime() {
    var t = ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      tone(f, t + i * 0.07, 0.22, "triangle", 0.07);
    });
  }

  function playGlitchZap() {
    var t = ctx.currentTime;
    var bufferSize = Math.floor(ctx.sampleRate * 0.12);
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var filter = ctx.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = 2000;
    var noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.05, t);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    noise.connect(filter).connect(noiseGain).connect(ctx.destination);
    noise.start(t);

    var osc = ctx.createOscillator();
    var oscGain = ctx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(900, t);
    osc.frequency.exponentialRampToValueAtTime(80, t + 0.09);
    oscGain.gain.setValueAtTime(0.04, t);
    oscGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    osc.connect(oscGain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.1);
  }

  // Looping background ambience - same original A-minor arpeggio as stream-end.html's (see
  // that file for why it's this pattern), copied rather than shared for the same reason as
  // every other sound here. Starts once the prompt actually begins typing (see startPrompt()
  // above) and keeps looping via setTimeout for as long as the page stays open.
  var BGM_STEP_MS = 260;
  var BGM_PATTERN = [
    110.00, null, 164.81, null, 130.81, null, 164.81, null, // A2 . E3 . C3 . E3 .
    110.00, null, 174.61, null, 130.81, null, 146.83, null, // A2 . F3 . C3 . D3 .
  ];
  var bgmStarted = false;
  function playBGM() {
    if (bgmStarted) return;
    bgmStarted = true;
    var step = 0;
    (function nextStep() {
      var freq = BGM_PATTERN[step % BGM_PATTERN.length];
      if (freq) tone(freq, ctx.currentTime, (BGM_STEP_MS / 1000) * 0.9, "triangle", 0.02);
      step++;
      setTimeout(nextStep, BGM_STEP_MS);
    })();
  }

  window.__bootSound = {
    blip: playBlip, ready: playReadyChime, glitch: playGlitchZap, key: playKeyClick, plotter: playPlotterTick,
    bgm: playBGM,
  };
  window.__bootGate.onReady(playBootChime);
})();
</script>

<script>
(function () {
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Off for now - chat mixed into the log needs another look (lines were still landing
  // on top of each other) before it goes back on. The rest of the plumbing
  // (window.__bootChat, the WebSocket forwarding in the boot gate script, ?source=) stays
  // in place; flipping this back to true is the whole re-enable.
  var CHAT_IN_LOG_ENABLED = false;

  var lines = [
    ["INFO",  "info",  "Boote Stream-Overlay …"],
    ["OK",    "ok",    "GPU erkannt: RX 9070 XT"],
    ["INFO",  "info",  "Kalibriere Hype-Level …"],
    ["OK",    "ok",    "Mikrofon: -12dB, sauber"],
    ["WARN",  "warn",  "Kaffee-Tank: niedrig"],
    ["INFO",  "info",  "Verbinde zu Twitch-Servern …"],
    ["OK",    "ok",    "Chat-Bot online"],
    ["DEBUG", "debug", "Lade Insider-Witze (37 geladen)"],
    ["INFO",  "info",  "Prüfe Internetverbindung … 1337 Quettabit/s"],
    ["OK",    "ok",    "Szenen-Übergänge geladen"],
    ["WARN",  "warn",  "motivation.service reagiert nicht — neu gestartet"],
    ["INFO",  "info",  "Suche Empfang …"],
    ["OK",    "ok",    "Stream-Key validiert"],
    ["INFO",  "info",  "Wecke Zuschauer aus dem Standby …"],
    ["DEBUG", "debug", "git pull origin good-vibes"],
    ["OK",    "ok",    "Alles bereit. Los geht's."],
    ["INFO",  "info",  "Lade Overlay-Assets …"],
    ["OK",    "ok",    "1440p @ 60fps bereit"],
    ["DEBUG", "debug", "Cache geleert: 12.4 GB Meme-Reserve"],
    ["WARN",  "warn",  "Zuschauererwartung: kritisch hoch"],
    ["INFO",  "info",  "Synchronisiere PS5 via mpv …"],
    ["OK",    "ok",    "Audio-Sync: 0ms Drift"],
    ["ERROR", "error", "Ironie-Modul nicht gefunden — Fallback aktiv"],
    ["INFO",  "info",  "Lade Chat-Emotes (128 geladen)"],
    ["OK",    "ok",    "Backup-Encoder bereit"],
    ["DEBUG", "debug", "sudo pacman -Syu vibes"],
    ["WARN",  "warn",  "RAM-Auslastung: 14 Chrome-Tabs offen"],
    ["INFO",  "info",  "Prüfe Discord-Verbindung …"],
    ["OK",    "ok",    "Szenen-Kollektion geladen: 'Gaming'"],
    ["INFO",  "info",  "Stimme das Mikro auf Optimismus …"]
  ];

  var log = document.getElementById("log");
  var maxLines = 7;
  var queue = [];
  var lastShown = null;

  function refillQueue() {
    var shuffled = lines.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
    }
    if (lastShown && shuffled[0] === lastShown && shuffled.length > 1) {
      var k = 1 + Math.floor(Math.random() * (shuffled.length - 1));
      var t = shuffled[0]; shuffled[0] = shuffled[k]; shuffled[k] = t;
    }
    queue = queue.concat(shuffled);
  }

  function nextEntry() {
    if (queue.length === 0) refillQueue();
    var entry = queue.shift();
    lastShown = entry;
    return entry;
  }

  function ts() {
    var d = new Date();
    function p(n) { return String(n).padStart(2, "0"); }
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // One row-builder for both the simulated boot lines and real chat (see addChatLine
  // below) - label/cssClass is a name already known to be safe (a fixed string, never user
  // input, even for chat: see there), text is typed out via textContent so it needs no
  // escaping of its own. isChat marks the row so eviction below can tell the two apart.
  // onDone, if given, fires once the typewriter reaches the end - not on a fixed delay -
  // which is what lets callers serialize on "actually finished" instead of "probably done
  // by now" (see typingLock below: a message longer than the old fixed pause was enough to
  // start a second line typing before the first had finished).
  function renderLine(label, cssClass, text, isChat, onDone) {
    var row = document.createElement("div");
    row.className = "log-line" + (isChat ? " log-line--chat" : "");
    row.innerHTML =
      '<span class="ts">[' + ts() + ']</span>' +
      '<span class="lvl ' + cssClass + '">' + label + "</span>" +
      '<span class="msg"></span>';
    log.appendChild(row);
    // Chat outranks the simulated lines: past maxLines, the oldest *simulated* line goes
    // first, and only once none are left does a chat line get pushed out - a chat message
    // scrolling away to make room for another "sudo pacman -Syu vibes" would be backwards.
    while (log.children.length > maxLines) {
      var victim = null;
      for (var c = 0; c < log.children.length; c++) {
        if (!log.children[c].classList.contains("log-line--chat")) { victim = log.children[c]; break; }
      }
      log.removeChild(victim || log.firstElementChild);
    }

    var msgEl = row.querySelector(".msg");
    if (reduceMotion) { msgEl.textContent = text; if (onDone) onDone(); return; }
    var i = 0;
    (function type() {
      msgEl.textContent = text.slice(0, i);
      if (i > 0 && window.__bootSound && text[i - 1] !== " ") window.__bootSound.plotter();
      i++;
      if (i <= text.length) setTimeout(type, 35 + Math.random() * 45);
      else if (onDone) onDone();
    })();
  }

  // Only one line ever types at a time, fake or chat - addLine()/addChatLine() both hold
  // this for the length of their own typewriter and release it (via releaseTypingLock) the
  // moment it finishes, not on a guessed delay. loop() below checks it before starting a
  // simulated line; drainChatQueue() checks it before starting a chat one - whichever asks
  // first while it's free gets it, but see releaseTypingLock for why chat effectively wins
  // ties.
  var typingLock = false;
  function releaseTypingLock() {
    typingLock = false;
    drainChatQueue(); // chat gets first refusal on the newly free slot, same priority as the eviction order above
  }

  function addLine() {
    var entry = nextEntry();

    if (window.__bootSound) {
      if (entry[2] === "Alles bereit. Los geht's.") {
        window.__bootSound.ready();
      } else {
        window.__bootSound.blip(entry[1]);
      }
    }

    if (window.__bootGlitch) {
      if (entry[1] === "error") {
        window.__bootGlitch.trigger();
      } else if (entry[1] === "warn" && Math.random() < 0.35) {
        window.__bootGlitch.trigger();
      }
    }

    typingLock = true;
    renderLine(entry[0], entry[1], entry[2], false, releaseTypingLock);
  }

  // Real chat mixed into the log - see window.__bootChat below and the WebSocket in the
  // boot gate script above, which forwards MESSAGE_ACCEPTED-derived "message" frames here.
  // The label is a real username - escaped, unlike the fake lines' hard-coded labels.
  function addChatLine(entry, onDone) {
    var name = escapeHtml(entry.user_name || "?");
    typingLock = true;
    renderLine(name + ":", "chat", entry.text || "", true, function () {
      releaseTypingLock();
      if (onDone) onDone();
    });
  }

  // Chat gets its own queue rather than going through window.__bootGate.onReady() directly
  // like everything else: onReady() runs every registered callback in one synchronous
  // batch, which - with several messages queued up over the three-second pause and the
  // prompt typing - meant all of them starting to render at the same instant. Here onReady
  // only unlocks the drain; typingLock (not a fixed delay) is what actually paces it, both
  // before and after that point.
  var chatQueue = [];
  var chatReady = false;
  var chatDraining = false;
  function drainChatQueue() {
    if (!chatReady || chatDraining || typingLock || !chatQueue.length) return;
    chatDraining = true;
    addChatLine(chatQueue.shift(), function () {
      setTimeout(function () { chatDraining = false; }, 700 + Math.random() * 900);
    });
  }
  window.__bootGate.onReady(function () { chatReady = true; drainChatQueue(); });
  window.__bootChat = {
    push: function (entry) {
      if (!CHAT_IN_LOG_ENABLED) return; // see the flag at the top of this script
      chatQueue.push(entry);
      drainChatQueue();
    },
  };

  var loopTimer = null;
  function loop() {
    if (typingLock || chatQueue.length) {
      // Something is already typing, or chat is waiting for its turn (which wins ties) -
      // don't start a simulated line on top of it, just check back shortly.
      loopTimer = setTimeout(loop, 400 + Math.random() * 400);
      return;
    }
    addLine();
    loopTimer = setTimeout(loop, 2200 + Math.random() * 1600);
  }

  var frames = ["⠇","⠏","⠟","⠿","⠾","⠼","⠸","⠰","⠠","⠀"];
  var fIdx = 0;
  var spinnerLabel = document.getElementById("spinnerLabel");
  function startSpinner() {
    if (reduceMotion) { spinnerLabel.textContent = "⠇ sende Signal …"; return; }
    setInterval(function () {
      fIdx = (fIdx + 1) % frames.length;
      spinnerLabel.textContent = frames[fIdx] + " sende Signal …";
    }, 100);
  }

  var barFill = document.getElementById("barFill");
  var pct = document.getElementById("pct");
  var current = 4;
  function stepBar() {
    // Slower, and less of a straight climb to a near-perfect number - a weak signal
    // struggling to lock on reads better than cruising smoothly to 94-99%.
    var target = 88 + Math.random() * 8;
    if (Math.random() < 0.22) target = 45 + Math.random() * 25;
    current += (target - current) * 0.1;
    var shown = Math.round(current);
    barFill.style.width = shown + "%";
    pct.textContent = shown + "%";
    setTimeout(stepBar, 1100 + Math.random() * 900);
  }

  window.__bootGate.onReady(function () {
    loop();
    startSpinner();
    stepBar();
  });
})();
</script>

<script>
(function () {
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduceMotion) return;

  var crt = document.querySelector(".crt");
  var h1 = document.querySelector(".hero-text h1");
  var originalTitle = h1.textContent;
  var glyphs = "▓▒░#@%&$01";

  function scrambleTitle() {
    var chars = originalTitle.split("");
    var count = 1 + Math.floor(Math.random() * 3);
    for (var n = 0; n < count; n++) {
      var idx = Math.floor(Math.random() * chars.length);
      if (chars[idx] === " ") continue;
      chars[idx] = glyphs[Math.floor(Math.random() * glyphs.length)];
    }
    h1.textContent = chars.join("");
    setTimeout(function () { h1.textContent = originalTitle; }, 90 + Math.random() * 80);
  }

  function makeSliceBar() {
    var bar = document.createElement("div");
    bar.className = "glitch-slice";
    var colors = ["rgba(255,176,0,.5)", "rgba(111,231,221,.45)", "rgba(255,95,109,.4)"];
    bar.style.top = Math.random() * 90 + "%";
    bar.style.height = (2 + Math.random() * 8) + "px";
    bar.style.background = colors[Math.floor(Math.random() * colors.length)];
    bar.style.transform = "translateX(" + (Math.random() * 16 - 8) + "px)";
    return bar;
  }

  function triggerGlitch() {
    crt.classList.add("glitching");
    scrambleTitle();

    var bars = [];
    var barCount = 1 + Math.floor(Math.random() * 2);
    for (var i = 0; i < barCount; i++) {
      var bar = makeSliceBar();
      crt.appendChild(bar);
      bars.push(bar);
      requestAnimationFrame((function (b) { return function () { b.classList.add("active"); }; })(bar));
    }

    if (window.__bootSound && window.__bootSound.glitch) window.__bootSound.glitch();

    setTimeout(function () {
      crt.classList.remove("glitching");
      bars.forEach(function (b) { b.remove(); });
    }, 300);
  }

  window.__bootGlitch = { trigger: triggerGlitch };

  /* Sparse, irregular ambient glitches — most glitches should instead be
     triggered by ERROR/WARN log lines (see addLine() below), not this timer.
     Gated like everything else that makes sound (triggerGlitch plays one via
     window.__bootSound.glitch) - no zaps during the quiet standby look. */
  function scheduleAmbientGlitch() {
    var delay = 15000 + Math.random() * 20000;
    setTimeout(function () {
      if (Math.random() < 0.3) triggerGlitch();
      scheduleAmbientGlitch();
    }, delay);
  }
  window.__bootGate.onReady(scheduleAmbientGlitch);
})();
</script>
