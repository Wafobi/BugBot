<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Overlay-Vorschau</title>
<!--
  One overview for the screens' variants, in three tabs:
    Start   layout variants of stream-boot.html  (themes/polarlicht-*.css)
    Ende    layout variants of stream-end.html   (themes/polarlicht-ende-*.css)
    Farben  polarlicht in other colours          (themes/pl-*.css, made by themes/palettes.py)
  Every preview is the real page in a frame, muted, without a bot (the end screen with its
  sample recap). Click one to open it full size. To use one: put its theme= into the URL of
  the OBS source instead of theme=polarlicht. The tab is remembered in the address (#start,
  #ende, #farben). The page itself loads nothing from the internet.
-->
<style>
  :root { --bg: #070920; --card: #0e1130; --edge: #2c3266; --ink: #e6ecff; --dim: #8a93c2; --hl: #5FEAF5;
          --font: "Noto Sans", system-ui, sans-serif; --mono: ui-monospace, "DejaVu Sans Mono", monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 32px 48px; background: var(--bg); color: var(--ink); font-family: var(--font); }
  h1 { margin: 0; font-size: 24px; font-weight: 650; }
  .sub { color: var(--dim); font-size: 13px; margin: 6px 0 18px; max-width: 90ch; line-height: 1.55; }
  code { font-family: var(--mono); font-size: 12px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tabs button { background: var(--card); color: var(--dim); border: 1px solid var(--edge); border-radius: 8px;
                 padding: 8px 18px; font: inherit; font-size: 14px; cursor: pointer; }
  .tabs button.on { color: var(--ink); border-color: var(--hl); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(540px, 1fr)); gap: 18px; }
  .card { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 12px; }
  .frames { display: grid; gap: 10px; }
  .frames.n3 { grid-template-columns: repeat(3, 1fr); }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 6px; display: block; }
  .frame:hover { outline: 1px solid var(--hl); }
  .frame iframe { position: absolute; left: 0; top: 0; width: 2560px; height: 1440px; border: 0;
                  transform-origin: 0 0; pointer-events: none; }
  .head { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .name { font-weight: 650; font-size: 15px; }
  .swatch { width: 110px; height: 12px; border-radius: 6px; }
  .what { color: var(--dim); font-size: 12.5px; margin-top: 3px; }
  .cmd { color: #6f78a8; font-family: var(--mono); font-size: 12px; margin-left: auto; }
  #farben .grid { grid-template-columns: 1fr; }
</style>
</head>
<body>
<h1>Overlay-Vorschau</h1>
<div class="sub">Varianten von Start- und Endbildschirm und das Theme in anderen Farben – jeweils die echte Seite, stumm,
  ohne Bot. Ein Klick öffnet groß. Übernehmen: in OBS in der URL der Quelle <code>theme=polarlicht</code> durch den
  angezeigten Namen ersetzen.</div>
<div class="tabs">
  <button data-tab="start">Start</button>
  <button data-tab="ende">Ende</button>
  <button data-tab="farben">Farben</button>
</div>
<div id="start" class="pane"><div class="grid"></div></div>
<div id="ende" class="pane"><div class="grid"></div></div>
<div id="farben" class="pane"><div class="grid"></div></div>
<script>
  var START = [
    ["polarlicht", "Aktuell", "So wie er jetzt ist."],
    ["polarlicht-seitlich", "Groß seitlich", "Controller groß links, Text daneben, Karte breiter."],
    ["polarlicht-oben", "Oben zentriert", "Controller groß über der Überschrift, alles mittig."],
    ["polarlicht-frei", "Frei schwebend", "Keine Karte, riesiger Controller, dünne Fortschrittslinie."],
    ["polarlicht-ring", "Im Ring", "Controller in einem runden Rahmen mit umlaufendem Rand."],
    ["polarlicht-banner", "Breites Banner", "Breite Karte, Überschrift im Farbverlauf, dicker Verlaufsbalken."]
  ];
  var ENDE = [
    ["polarlicht", "Aktuell", "So wie er jetzt ist."],
    ["polarlicht-ende-verlauf", "Verlauf", "Überschrift und Zahlen im Farbverlauf, Verlaufslinie über jeder Kachel."],
    ["polarlicht-ende-frei", "Frei", "Keine Karte, großer Controller und Überschrift, Kacheln als Glas."],
    ["polarlicht-ende-spalten", "Zwei Spalten", "Breite Karte: links Controller und Titel, rechts Zahlen und Namen."],
    ["polarlicht-ende-zahlen", "Große Zahlen", "Ohne Kachelrahmen, große Zahlen im Verlauf, feine Trennlinien."],
    ["polarlicht-ende-ring", "Im Ring", "Controller im umlaufenden Ring, alles mittig – passend zum Start „Im Ring“."]
  ];
  var FARBEN = [
    ["polarlicht", "Polarlicht (aktuell)", "#5FEAF5", "#F22A80"],
    ["pl-wafobi", "Wafobi-Logo", "#26D5D5", "#A72ED9"],
    ["pl-sunset", "Sonnenuntergang", "#FFB347", "#FF3F86"],
    ["pl-synthwave", "Synthwave", "#FF4FD8", "#7B5CFF"],
    ["pl-toxic", "Toxic", "#9BFF5C", "#1FC8FF"],
    ["pl-ozean", "Ozean", "#4FC3FF", "#2FFFB4"],
    ["pl-lava", "Lava", "#FFD34F", "#FF3B2F"],
    ["pl-eis", "Eis", "#DDF3FF", "#5B86FF"],
    ["pl-vapor", "Vaporwave", "#B48CFF", "#45F0D0"]
  ];
  function frame(page, theme) {
    var url = page + "?theme=" + theme + "&mute=1" + (page === "stream-end.html" ? "&demo=1" : "");
    return '<a class="frame" href="' + url + '" target="_blank"><iframe loading="lazy" data-src="' + url + '"></iframe></a>';
  }
  function card(frames, name, extra, what, theme) {
    return '<div class="card"><div class="frames' + (frames.length > 1 ? " n3" : "") + '">' + frames.join("") + "</div>" +
      '<div class="head"><span class="name">' + name + "</span>" + extra + '<span class="cmd">theme=' + theme + "</span></div>" +
      (what ? '<div class="what">' + what + "</div>" : "") + "</div>";
  }
  document.querySelector("#start .grid").innerHTML = START.map(function (v) {
    return card([frame("stream-boot.html", v[0])], v[1], "", v[2], v[0]); }).join("");
  document.querySelector("#ende .grid").innerHTML = ENDE.map(function (v) {
    return card([frame("stream-end.html", v[0])], v[1], "", v[2], v[0]); }).join("");
  document.querySelector("#farben .grid").innerHTML = FARBEN.map(function (p) {
    return card(["stream-boot.html", "stream-pause.html", "stream-end.html"].map(function (page) { return frame(page, p[0]); }),
      p[1], '<span class="swatch" style="background:linear-gradient(90deg,' + p[2] + "," + p[3] + ')"></span>', "", p[0]); }).join("");

  // Only the visible tab's frames are loaded - dozens of live pages at once would be heavy.
  function fit() {
    document.querySelectorAll(".pane:not([hidden]) .frame").forEach(function (f) {
      f.firstChild.style.transform = "scale(" + f.clientWidth / 2560 + ")"; });
  }
  function show(tab) {
    document.querySelectorAll(".pane").forEach(function (p) {
      var on = p.id === tab;
      p.hidden = !on;
      p.querySelectorAll("iframe").forEach(function (f) {
        if (on && !f.src) f.src = f.dataset.src;
        if (!on && f.src) f.removeAttribute("src");
      });
    });
    document.querySelectorAll(".tabs button").forEach(function (b) { b.classList.toggle("on", b.dataset.tab === tab); });
    history.replaceState(null, "", "#" + tab);
    fit();
  }
  document.querySelectorAll(".tabs button").forEach(function (b) { b.onclick = function () { show(b.dataset.tab); }; });
  window.addEventListener("resize", fit);
  show((location.hash || "#start").slice(1));
</script>
</body>
</html>
