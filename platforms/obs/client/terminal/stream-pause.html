<title>Stream Pause</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /*
    Same terminal system as ad-break.html, but for a manually triggered
    pause (bathroom break, technical hiccup, quick AFK) instead of a fixed
    ad slot. Two differences that follow from "I decide when this ends":
    the bar is indeterminate (no fake percentage climbing toward a target
    it can't know), and the right-hand readout is a live elapsed timer
    instead of a %. Page background is transparent on purpose (OBS Browser
    Source).
  */

  :root {
    --ink: #15100a;
    --ink-deep: #0d0904;
    --ink-line: #2a1f10;
    --amber: #ffb000;
    --amber-soft: #d99a3d;
    --amber-dim: #8a6a34;
    --glow: rgba(255, 176, 0, 0.35);
    --font-display: "VT323", ui-monospace, "Courier New", monospace;
    --font-body: "IBM Plex Mono", ui-monospace, "SFMono-Regular", "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent; /* deliberate: OBS Browser Source needs a see-through page */
  }

  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 90px;
    min-height: 100vh;
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  @keyframes blink { 50% { opacity: .15; } }

  .crt {
    position: relative;
    width: min(460px, 90vw);
    background: linear-gradient(180deg, var(--ink) 0%, var(--ink-deep) 100%);
    border: 1px solid var(--ink-line);
    border-radius: 6px;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.4),
      0 20px 60px rgba(0, 0, 0, 0.55),
      0 0 40px var(--glow);
    overflow: hidden;
  }

  .screen { position: relative; padding: 22px 24px; }
  .screen::before {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg, rgba(255,176,0,.05) 0px, rgba(255,176,0,.05) 1px, transparent 1px, transparent 3px
    );
    mix-blend-mode: overlay;
    z-index: 3;
  }
  .screen::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 60px rgba(0,0,0,.65);
    z-index: 3;
  }

  .body-stack { display: flex; flex-direction: column; gap: 16px; }

  .prompt { font-size: 13px; color: var(--amber-soft); }
  .prompt .cursor {
    display: inline-block;
    width: 8px; height: 14px;
    background: var(--amber);
    vertical-align: -2px;
    margin-left: 2px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .prompt .cursor { animation: blink 1s steps(1) infinite; }
  }

  .caption {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: .08em;
    color: var(--amber-soft);
    text-transform: uppercase;
  }

  .bar-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 8px;
    font-size: 12px; color: var(--amber-soft);
    font-variant-numeric: tabular-nums;
  }
  .bar-row .timer { font-family: var(--font-display); font-size: 22px; color: var(--amber); }

  .bar {
    position: relative;
    height: 18px;
    border-radius: 5px;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--ink-line);
    overflow: hidden;
  }
  .bar-fill {
    position: absolute;
    top: 0; bottom: 0;
    left: -34%;
    width: 34%;
    background: linear-gradient(90deg, transparent, var(--amber-dim), var(--amber), var(--amber-dim), transparent);
    box-shadow: 0 0 10px var(--glow);
  }
  @media (prefers-reduced-motion: no-preference) {
    .bar-fill { animation: indeterminate 1.7s ease-in-out infinite; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bar-fill { left: 33%; }
  }
  @keyframes indeterminate {
    0%   { left: -34%; }
    100% { left: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }
</style>

<!-- ?theme=<name> loads themes/<name>.css - the same file ad-break.html and
     stream-boot.html in this folder load for the same ?theme=. See themes/README.md. -->
<script>
(function () {
  var theme = new URLSearchParams(location.search).get("theme");
  if (!theme) return;
  var link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = "themes/" + encodeURIComponent(theme) + ".css";
  document.currentScript.insertAdjacentElement("afterend", link);
})();
</script>

<div class="crt">
  <div class="screen">
    <div class="body-stack">
      <div class="prompt">wafobitv@twich.tv:~$ ./pause.sh --status<span class="cursor"></span></div>
      <div class="caption">Pause</div>
      <div>
        <div class="bar-row">
          <span id="spinnerLabel">⠋ bin gleich zurück …</span>
          <span class="timer" id="timer">00:00</span>
        </div>
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var frames = ["⠇","⠏","⠟","⠿","⠾","⠼","⠸","⠰","⠠","⠀"];
  var fIdx = 0;
  var spinnerLabel = document.getElementById("spinnerLabel");

  var messages = [
    "bin gleich zurück …",
    "kaffee wird nachgeladen …",
    "afk.service läuft …",
    "sammle Snacks …",
    "renne kurz zur Toilette …",
    "debugge das echte Leben …",
    "reboote meine Motivation …",
    "kurzer Reality-Check …",
    "lade Aufmerksamkeit nach …",
    "gieße die Zimmerpflanze …",
    "strecke die Beine …",
    "checke kurz Discord …",
    "hole frische Luft …",
    "pausiere den Menschen, nicht den Stream"
  ];
  var queue = [];
  var lastLabel = null;
  var label = messages[0];

  function refillQueue() {
    var shuffled = messages.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
    }
    if (lastLabel && shuffled[0] === lastLabel && shuffled.length > 1) {
      var k = 1 + Math.floor(Math.random() * (shuffled.length - 1));
      var t = shuffled[0]; shuffled[0] = shuffled[k]; shuffled[k] = t;
    }
    queue = queue.concat(shuffled);
  }

  function nextLabel() {
    if (queue.length === 0) refillQueue();
    lastLabel = queue.shift();
    return lastLabel;
  }

  if (!reduceMotion) {
    setInterval(function () {
      fIdx = (fIdx + 1) % frames.length;
      spinnerLabel.textContent = frames[fIdx] + " " + label;
    }, 100);
    (function rotateLabel() {
      label = nextLabel();
      setTimeout(rotateLabel, 2400 + Math.random() * 1400);
    })();
  } else {
    spinnerLabel.textContent = "⠇ " + messages[0];
  }

  var timerEl = document.getElementById("timer");
  var startTime = Date.now();
  function tick() {
    var elapsed = Math.floor((Date.now() - startTime) / 1000);
    var m = String(Math.floor(elapsed / 60)).padStart(2, "0");
    var s = String(elapsed % 60).padStart(2, "0");
    timerEl.textContent = m + ":" + s;
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
