<!DOCTYPE html>
<!--
  TTS control panel for an OBS dock (Docks -> Custom Browser Docks), served by the bot
  (platforms/twitch/features/tts/admin.py): http://127.0.0.1:4457/tts/dock?token=<TTS_TOKEN>
  Shows the queue and releases it - the same /tts/next and /tts/skip a Stream Deck button
  would call. Speech is made on the server; this page plays nothing itself.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<title>TTS</title>
<style>
  :root {
    --ink: #15100a; --ink-line: #2a1f10; --amber: #ffb000; --amber-dim: #8a6a34;
    --green: #7cffb2; --red: #ff5f6d; --cyan: #6fe7dd;
    --font: "IBM Plex Mono", ui-monospace, "SFMono-Regular", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ink); color: #e9d9b8; font-family: var(--font); font-size: 13px;
    display: flex; flex-direction: column; padding: 8px; gap: 8px;
  }
  .btns { display: grid; grid-template-columns: 2fr 1fr; gap: 6px; }
  button {
    font: inherit; font-size: 15px; font-weight: 700; padding: 10px 6px; border-radius: 4px;
    border: 1px solid var(--ink-line); cursor: pointer; color: #e9d9b8; background: rgba(0,0,0,.35);
  }
  button.play { background: var(--amber); color: #0d0904; border: none; }
  button:disabled { opacity: .45; cursor: default; }
  #info { font-size: 12px; color: var(--amber-dim); display: flex; justify-content: space-between; gap: 6px; }
  #info .ok { color: var(--green); } #info .err { color: var(--red); }
  #queue { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .item { padding: 6px 8px; border: 1px solid var(--ink-line); border-radius: 4px; background: rgba(0,0,0,.25); }
  .item:first-child { border-color: var(--amber-dim); }
  .item .who { color: var(--cyan); font-size: 11px; }
  .empty { color: var(--amber-dim); text-align: center; padding: 16px 0; }
  #status { font-size: 12px; min-height: 1.3em; }
  #status.ok { color: var(--green); } #status.err { color: var(--red); }
</style>
</head>
<body>
  <div class="btns">
    <button class="play" id="next">▶ Abspielen</button>
    <button id="skip">⏭ Skip</button>
  </div>
  <div id="info"><span id="count">…</span><span id="player">…</span></div>
  <div id="status"></div>
  <div id="queue"></div>
<script>
(function () {
  var token = new URLSearchParams(location.search).get("token") || "";
  var $ = function (id) { return document.getElementById(id); };
  var busy = false;

  function setStatus(text, cls) { $("status").textContent = text; $("status").className = cls || ""; }

  function render(data) {
    var q = data.queue || [];
    $("count").textContent = q.length + " in der Warteschlange";
    $("player").innerHTML = data.player
      ? '<span class="ok">● Abspieler verbunden</span>'
      : '<span class="err">● kein Abspieler (TTS-Quelle in OBS?)</span>';
    var box = $("queue");
    box.innerHTML = "";
    if (!q.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Nichts wartet.";
      box.appendChild(empty);
    }
    q.forEach(function (entry) {
      var item = document.createElement("div");
      item.className = "item";
      var who = document.createElement("div");
      who.className = "who";
      who.textContent = entry.user_name || "";
      var text = document.createElement("div");
      text.textContent = entry.text;
      item.appendChild(who);
      item.appendChild(text);
      box.appendChild(item);
    });
    $("next").disabled = busy || !q.length || !data.player;
    $("skip").disabled = busy || !q.length;
  }

  function refresh() {
    return fetch("/tts/dock/queue?token=" + encodeURIComponent(token))
      .then(function (r) { if (!r.ok) throw new Error(r.status === 401 ? "falscher Token" : r.status); return r.json(); })
      .then(render)
      .catch(function (e) { setStatus("Keine Verbindung zum Bot: " + e.message, "err"); });
  }

  function press(path, label) {
    busy = true;
    $("next").disabled = $("skip").disabled = true;
    setStatus(label);
    fetch(path + "?token=" + encodeURIComponent(token))
      .then(function (r) { return r.text().then(function (t) { setStatus(t.trim(), r.ok ? "ok" : "err"); }); })
      .catch(function (e) { setStatus("Fehler: " + e.message, "err"); })
      .finally(function () { busy = false; refresh(); });
  }

  $("next").addEventListener("click", function () { press("/tts/next", "Erzeuge Sprache …"); });
  $("skip").addEventListener("click", function () { press("/tts/skip", "Überspringe …"); });

  if (!token) { setStatus("Kein ?token= in der URL (TTS_TOKEN).", "err"); return; }
  refresh();
  setInterval(function () { if (!busy) refresh(); }, 2000);
})();
</script>
</body>
</html>
