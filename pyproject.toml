[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# E4/E7/E9 (pycodestyle) + F (pyflakes) + UP (pyupgrade) - ruff's own documented default
# selection, spelled out explicitly rather than left to "whatever this ruff version
# defaults to". Deliberately conservative: this is the first linter this project has ever
# had, and the point is a clean, useful baseline - not importing every opinionated ruleset
# (bugbear, blind-except, ...) on day one and immediately fighting patterns the codebase
# uses on purpose (see core/events.py:EventBus.publish/announce for why a bare
# `except Exception` is the correct choice in several places here).
select = ["E4", "E7", "E9", "F", "UP"]
ignore = [
    # "if x: return" as a one-line guard clause is used throughout the codebase on purpose
    # (see e.g. platforms/discord/bot.py's on_message/on_raw_reaction_remove) - it is not
    # inconsistent formatting that needs fixing, it is the house style for early returns.
    "E701",
]

[tool.bandit]
# Every skip below is a check bandit raises unconditionally in a shape this codebase uses
# deliberately, already verified safe by hand (see the 2026-08-23 security review's
# "Anhang: Prüfungen ohne Befund") rather than something nobody looked at. A finding in a
# *different* shape - a SQL f-string that interpolates something other than a module
# constant, a subprocess call with shell=True - still gets caught, because none of these
# skips are about the underlying pattern, only about bandit's blunt heuristic for spotting
# it.
skips = [
    "B608",  # hardcoded_sql_expressions: every f-string SQL query here interpolates a
             # module-level constant (table/column name), never request-derived input -
             # the actual value always goes through a parameterized "?" placeholder.
    "B104",  # hardcoded_bind_all_interfaces: the WebSocket listeners' bind="0.0.0.0"
             # defaults are correct for how they are deployed - reachable only via the
             # container's own port publishing, which the Podman Quadlet restricts to
             # 127.0.0.1 on the host (see docs/deployment.md).
    "B105",  # hardcoded_password_string: false-positives on URL constants whose name
             # happens to contain "token" (TOKEN_URL, VALIDATE_URL, ...), not an actual
             # credential.
    "B107",  # hardcoded_password_default: same false-positive, on password="" default
             # arguments that mean "no password configured", not a real default secret.
    "B311",  # random: every random.* call here picks a giveaway winner or an XP amount -
             # a game mechanic, not anything security- or token-related (which uses the
             # `secrets` module instead, e.g. platforms/twitch/get_token.py's CSRF state).
    "B404",  # import_subprocess / B603/B607 command-injection checks: subprocess is used
             # in exactly two places (check_config.py, the OBS relay's script launcher),
             # neither with shell=True or unsanitized input - see the security review.
    "B603",
    "B607",
]
