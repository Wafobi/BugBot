<meta charset="utf-8">
<title>BugBot Chat Panel</title>

<!--
  The browser source for the chat in the picture. Belongs on the OBS machine, not the server -
  like features/overlay/client/bars.html it sits here because it belongs to its counterpart
  (features/chat_panel/server.py), and runs elsewhere.

  Setup: add a "Browser" source, width/height to taste (e.g. 420x900 - unlike bars.html this
  page is not a fixed 2560x1440 canvas, it fills the source at whatever size it's given), and
  as URL the file with a token:

    file:///path/to/bugbot/features/chat_panel/client/chat.html?token=YOUR_CHAT_PANEL_TOKEN

  To see it without OBS: open preview.html next to it, or append ?demo=1 to this file.

  Parameters (all optional):
    token=   the CHAT_PANEL_TOKEN from the bot's .env. Without it, no data.
    host=    default 127.0.0.1 - the tunnel ends here, not at the server
    port=    port of the tunnel on this machine (default 4458)
    source=  which chat source(s) this instance shows, comma-separated: source=twitch
             or source=twitch,discord. Empty = everything the bot sends (default). This
             lets several browser sources hang off the same CHAT_PANEL_TOKEN and still show
             different things - one Twitch-only, one Discord-only - without chat_panel.json
             having to say anything about it; the filtering happens here, not at the bot,
             which keeps sending everything to every connected source.
    max=     how many lines stay visible, older ones scroll out (default 12)
    badge=0  hide the platform badge in front of the name
    accent=  accent color, URL-encoded: %23FFE100 for #FFE100
    t.NAME=  override any single design token, e.g. t.msg-size=30px
    link=1   show the connection lamp, top right (default off)
    linewidth=  from how many characters a message gets split into several chat lines
             (at word boundaries, where possible) - each piece gets its own name/badge, and
             reads like several short messages instead of one long one. Left empty: never
             split, a message stays one line (which can then wrap/grow).
    bar=     height of the bottom bar from bars.html in pixels - the chat grows upward from
             the bottom only up to this height and so stays within the bar's band, instead
             of running past it into the middle of the picture. Same value as the ?bar=
             there (default there 184). Left empty: chat grows unbounded upward.
    maxchars=  message gets truncated to this many characters (with "…") before splitting -
             a hard ceiling so a single message cannot produce an unbounded number of lines
             and push everyone else out of the feed (default 150, 0 = never truncate)
    idle=    seconds of quiet in chat before the feed fades out (default 8, 0 = never fade)
    fade=    seconds for the fade-in/fade-out animation (default 2.5)
    demo=1   sample messages without a connection - for looking at it in a normal browser

  Only what moderation lets through ever arrives here at all (see feature.py) - this script
  therefore never has to delete anything, only display and eventually let it scroll off the
  list.
-->

<style>
  :root {
    --font: "Roboto", "DejaVu Sans", system-ui, sans-serif;
    --msg-size: 26px;
    --name-weight: 700;
    --gap: 10px;
    --pad: 16px;
    --text-shadow: 0 1px 3px rgba(0, 0, 0, .9), 0 0 12px rgba(0, 0, 0, .5);

    --accent: #5FEAF5;    /* mod/broadcaster */
    --sub: #F22A80;       /* subscriber */
    --ink: #EAF7FF;       /* ordinary viewers */
    --dim: rgba(234, 247, 255, .55);
    --dot-off: #2A2C50;
    --dot-ok: #34C759;

    --margin: 10px;
    --fade: 2.5s;
    --feed-max-height: none;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh;
    background: transparent;
    overflow: hidden;
    font-family: var(--font);
    color: var(--ink);
    text-shadow: var(--text-shadow);
    -webkit-font-smoothing: antialiased;
  }

  #feed {
    position: absolute;
    right: var(--margin); bottom: var(--margin); left: var(--margin);
    /* No top: the box sizes to its content (bottom-anchored, growing upward as messages
       arrive) and max-height simply stops that growth once it reaches the bar - it never
       sits above bars.html's bottom bar, it stays inside its band. */
    max-height: var(--feed-max-height);
    display: flex; flex-direction: column; justify-content: flex-end;
    gap: var(--gap);
    padding: var(--pad);
    overflow: hidden;
    opacity: 1;
    transition: opacity var(--fade) ease;
  }
  #feed.idle { opacity: 0; }

  .msg {
    display: flex; align-items: baseline; gap: 8px;
    font-size: var(--msg-size);
    line-height: 1.3;
    animation: rise .25s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .badge {
    font-size: .55em;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--dim);
    border: 1px solid var(--dim);
    border-radius: 4px;
    padding: 1px 5px;
    align-self: center;
  }

  .name { font-weight: var(--name-weight); white-space: nowrap; }
  .name.privileged { color: var(--accent); }
  .name.subscriber { color: var(--sub); }

  .text { word-break: break-word; }

  /* Connection lamp, only interesting while setting up - same as in bars.html. */
  #link { display: none; }
  #link.shown {
    display: block;
    position: absolute; right: 6px; top: 6px; z-index: 4;
    width: 8px; height: 8px; border-radius: 50%;
    background: #FF3B30; opacity: .5;
  }
  #link.ok { background: var(--dot-ok); }
</style>

<div id="feed"></div>
<div id="link"></div>

<script>
"use strict";

const params = new URLSearchParams(location.search);
const root = document.documentElement.style;

// --- Design: like in bars.html - a shorthand for the most common case, otherwise the
// general path over every token from :root. ---------------------------------------------
if (params.has("accent")) root.setProperty("--accent", params.get("accent"));
for (const [name, value] of params) {
  if (name.startsWith("t.") && name.length > 2) root.setProperty("--" + name.slice(2), value);
}

if (params.get("link") === "1") document.getElementById("link").classList.add("shown");

const feed = document.getElementById("feed");
const MAX_VISIBLE = Math.max(1, parseInt(params.get("max"), 10) || 12);
const SHOW_BADGE = params.get("badge") !== "0";
// Hard safety cap on total message length, cut with "…" before splitting - so one message
// cannot flood the feed with an unbounded number of chunks and evict everyone else's lines.
const MAX_CHARS = params.has("maxchars") ? Math.max(0, parseInt(params.get("maxchars"), 10) || 0) : 150;
// How many characters make up one chunk/line, before a long message is split into several -
// each chunk becomes its own chat line, with its own name/badge, same as if that person had
// sent several shorter messages in a row.
const CHUNK_CHARS = params.has("linewidth") ? Math.max(10, parseInt(params.get("linewidth"), 10) || 50) : 0;

// Fades out on quiet chat - 0 switches it off, for whoever wants the feed always visible.
const IDLE_MS = params.has("idle") ? Math.max(0, parseFloat(params.get("idle")) * 1000) : 8000;
if (params.has("fade")) root.setProperty("--fade", Math.max(0.1, parseFloat(params.get("fade"))) + "s");
if (params.has("bar")) root.setProperty("--feed-max-height", Math.max(0, parseFloat(params.get("bar")) || 0) + "px");

let idleTimer = null;
function scheduleIdle() {
  feed.classList.remove("idle");
  if (idleTimer) clearTimeout(idleTimer);
  if (IDLE_MS > 0) idleTimer = setTimeout(() => feed.classList.add("idle"), IDLE_MS);
}

// Which platform(s) this instance shows - empty means all. The filtering happens here and
// not at the bot: it sends the same thing to every connected source, source= only decides
// afterward what from the stream actually lands in the picture.
const SOURCES = (params.get("source") || "")
  .split(",").map((s) => s.trim().toLowerCase()).filter(Boolean);

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Ordinary viewers get no fixed color (--ink for everyone) but one derived from their name -
// like in Twitch chat itself, so names in the feed stay easy to tell apart. Mods/broadcaster
// and subs keep their fixed role color, see .privileged/.subscriber.
function nameColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) | 0;
  return `hsl(${Math.abs(hash) % 360}, 75%, 68%)`;
}

function truncate(text) {
  if (!MAX_CHARS || text.length <= MAX_CHARS) return text;
  return text.slice(0, MAX_CHARS).trimEnd() + "…";
}

// Breaks text into CHUNK_CHARS-ish pieces at word boundaries where possible (only a hard
// cut mid-word if a single word is itself longer than a chunk) - each piece becomes its own
// chat line in addMessage, so a long message reads as several short ones instead of one
// tall or scrolling one.
function splitChunks(text) {
  if (!CHUNK_CHARS || text.length <= CHUNK_CHARS) return [text];
  const chunks = [];
  let rest = text;
  while (rest.length > CHUNK_CHARS) {
    let cut = rest.lastIndexOf(" ", CHUNK_CHARS);
    if (cut <= 0) cut = CHUNK_CHARS;
    chunks.push(rest.slice(0, cut).trimEnd());
    rest = rest.slice(cut).trimStart();
  }
  if (rest) chunks.push(rest);
  return chunks;
}

function addLine(entry, text) {
  const div = document.createElement("div");
  div.className = "msg";
  div.dataset.id = entry.id ?? "";

  const name = entry.user_name || "";
  const nameClass = entry.is_privileged ? "privileged" : entry.is_subscriber ? "subscriber" : "";
  const nameStyle = nameClass ? "" : ` style="color:${nameColor(name)}"`;
  div.innerHTML =
    (SHOW_BADGE ? `<span class="badge">${escapeHtml(entry.platform || "")}</span>` : "") +
    `<span class="name ${nameClass}"${nameStyle}>${escapeHtml(name)}</span>` +
    `<span class="text">${escapeHtml(text)}</span>`;

  feed.appendChild(div);
  while (feed.children.length > MAX_VISIBLE) feed.removeChild(feed.firstElementChild);
}

// One pass per message - split into several lines first (see splitChunks), each with its
// own name/badge so who wrote it stays visible on every one of them.
function addMessage(entry) {
  if (SOURCES.length && !SOURCES.includes((entry.platform || "").toLowerCase())) return;
  for (const chunk of splitChunks(truncate(entry.text || ""))) addLine(entry, chunk);
  scheduleIdle();
}

// --- Connection ------------------------------------------------------------------------
// The bot sends, we listen - like bars.html. If the connection drops, it reconnects on its
// own, without anyone having to touch the source.
function connect() {
  const token = params.get("token") || "";
  const host = params.get("host") || "127.0.0.1";
  const port = params.get("port") || "4458";
  if (!token) { console.warn("Kein ?token= in der URL - keine Verbindung."); return; }

  const socket = new WebSocket(`ws://${host}:${port}/?token=${encodeURIComponent(token)}`);

  socket.onopen = () => document.getElementById("link").classList.add("ok");
  socket.onclose = () => {
    document.getElementById("link").classList.remove("ok");
    setTimeout(connect, 3000);
  };
  socket.onerror = () => socket.close();
  socket.onmessage = (message) => {
    let frame;
    try { frame = JSON.parse(message.data); } catch { return; }
    if (frame.type === "history") {
      feed.innerHTML = "";
      for (const entry of frame.data || []) addMessage(entry);
    } else if (frame.type === "message") {
      addMessage(frame.data);
    } else if (frame.type === "clear") {
      feed.innerHTML = "";
    }
  };
}

// --- Start -----------------------------------------------------------------------------
if (params.get("demo") === "1") {
  const sample = [
    { id: 1, platform: "twitch", user_name: "Kevin", text: "moin moin! 👋" },
    { id: 2, platform: "twitch", user_name: "ModDoro", text: "willkommen im Stream", is_privileged: true },
    { id: 3, platform: "discord", user_name: "Lenaa", text: "das Overlay sieht super aus", is_subscriber: true },
    { id: 4, platform: "twitch", user_name: "xX_Gamer_Xx", text: "wie heißt der Boss nochmal?" },
    { id: 5, platform: "twitch", user_name: "Kevin", text: "PogChamp PogChamp" },
  ];
  for (const entry of sample) addMessage(entry);
} else {
  connect();
}
</script>
