<meta charset="utf-8">
<title>BugBot Chat Panel</title>

<!--
  Die Browser-Quelle für den Chat im Bild. Gehört auf den OBS-Rechner, nicht auf den Server -
  wie features/overlay/client/bars.html liegt sie hier, weil sie zum Gegenstück gehört
  (features/chat_panel/server.py), und läuft woanders.

  Einrichten: Quelle "Browser" anlegen, Breite/Höhe nach Geschmack (z.B. 420x900 - anders als
  bars.html ist diese Seite kein fester 2560x1440-Canvas, sondern füllt die Quelle, wie groß
  sie auch gewählt wird), und als URL die Datei mit Token:

    file:///pfad/zu/bugbot/features/chat_panel/client/chat.html?token=DEIN_CHAT_PANEL_TOKEN

  Zum Anschauen ohne OBS: preview.html daneben öffnen, oder ?demo=1 an diese Datei anhängen.

  Parameter (alle optional):
    token=   das CHAT_PANEL_TOKEN aus der .env des Bots. Ohne ihn keine Daten.
    host=    Default 127.0.0.1 - der Tunnel endet hier, nicht beim Server
    port=    Port des Tunnels auf diesem Rechner (Default 4458)
    source=  welche Chat-Quelle(n) diese Instanz zeigt, mit Komma getrennt: source=twitch
             oder source=twitch,discord. Leer = alle, die der Bot schickt (Default). Damit
             können mehrere Browser-Quellen an derselben CHAT_PANEL_TOKEN hängen und trotzdem
             unterschiedliches zeigen - eine nur Twitch, eine nur Discord - ohne dass
             chat_panel.json etwas dazu sagen müsste; die Filterung passiert hier, nicht beim
             Bot, der weiterhin an alle verbundenen Quellen alles schickt.
    max=     wie viele Zeilen sichtbar bleiben, ältere rutschen raus (Default 12)
    badge=0  die Plattform-Marke vor dem Namen ausblenden
    accent=  Akzentfarbe, URL-kodiert: %23FFE100 für #FFE100
    t.NAME=  jedes einzelne Gestaltungs-Token überschreiben, z.B. t.msg-size=30px
    link=1   Verbindungsampel oben rechts einblenden (Standard: aus)
    demo=1   Beispielnachrichten ohne Verbindung - zum Anschauen im normalen Browser

  Nur was die Moderation durchlässt, kommt überhaupt hier an (siehe feature.py) - dieses
  Skript muss also nichts löschen, nur anzeigen und irgendwann aus der Liste rutschen lassen.
-->

<style>
  :root {
    --font: "Roboto", "DejaVu Sans", system-ui, sans-serif;
    --msg-size: 26px;
    --name-weight: 700;
    --gap: 10px;
    --pad: 16px;
    --text-shadow: 0 1px 3px rgba(0, 0, 0, .9), 0 0 12px rgba(0, 0, 0, .5);

    --accent: #5FEAF5;    /* Mod/Broadcaster */
    --sub: #F22A80;       /* Abonnent*in */
    --ink: #EAF7FF;       /* normale Zuschauer*innen */
    --dim: rgba(234, 247, 255, .55);
    --dot-off: #2A2C50;
    --dot-ok: #34C759;

    --margin: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh;
    background: transparent;
    overflow: hidden;
    font-family: var(--font);
    color: var(--ink);
    text-shadow: var(--text-shadow);
    -webkit-font-smoothing: antialiased;
  }

  #feed {
    position: absolute;
    top: var(--margin); right: var(--margin); bottom: var(--margin); left: var(--margin);
    display: flex; flex-direction: column; justify-content: flex-end;
    gap: var(--gap);
    padding: var(--pad);
    overflow: hidden;
  }

  .msg {
    display: flex; align-items: baseline; gap: 8px;
    font-size: var(--msg-size);
    line-height: 1.3;
    animation: rise .25s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .badge {
    font-size: .55em;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--dim);
    border: 1px solid var(--dim);
    border-radius: 4px;
    padding: 1px 5px;
    align-self: center;
  }

  .name { font-weight: var(--name-weight); white-space: nowrap; }
  .name.privileged { color: var(--accent); }
  .name.subscriber { color: var(--sub); }

  .text { word-break: break-word; }

  /* Verbindungsampel, nur beim Einrichten interessant - wie in bars.html. */
  #link { display: none; }
  #link.shown {
    display: block;
    position: absolute; right: 6px; top: 6px; z-index: 4;
    width: 8px; height: 8px; border-radius: 50%;
    background: #FF3B30; opacity: .5;
  }
  #link.ok { background: var(--dot-ok); }
</style>

<div id="feed"></div>
<div id="link"></div>

<script>
"use strict";

const params = new URLSearchParams(location.search);
const root = document.documentElement.style;

// --- Gestaltung: wie in bars.html - Kurzname für den häufigsten Fall, sonst der
// allgemeine Weg über jedes Token aus :root. ---------------------------------------------
if (params.has("accent")) root.setProperty("--accent", params.get("accent"));
for (const [name, value] of params) {
  if (name.startsWith("t.") && name.length > 2) root.setProperty("--" + name.slice(2), value);
}

if (params.get("link") === "1") document.getElementById("link").classList.add("shown");

const feed = document.getElementById("feed");
const MAX_VISIBLE = Math.max(1, parseInt(params.get("max"), 10) || 12);
const SHOW_BADGE = params.get("badge") !== "0";

// Welche Plattform(en) diese Instanz zeigt - leer heißt alle. Das Filtern passiert hier und
// nicht beim Bot: der schickt jeder verbundenen Quelle dasselbe, source= entscheidet erst
// hinterher, was aus dem Strom tatsächlich im Bild landet.
const SOURCES = (params.get("source") || "")
  .split(",").map((s) => s.trim().toLowerCase()).filter(Boolean);

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Ein Durchgang pro Nachricht - bei einer Chatzeile lohnt kein Diffing.
function addMessage(entry) {
  if (SOURCES.length && !SOURCES.includes((entry.platform || "").toLowerCase())) return;

  const div = document.createElement("div");
  div.className = "msg";
  div.dataset.id = entry.id ?? "";

  const nameClass = entry.is_privileged ? "privileged" : entry.is_subscriber ? "subscriber" : "";
  div.innerHTML =
    (SHOW_BADGE ? `<span class="badge">${escapeHtml(entry.platform || "")}</span>` : "") +
    `<span class="name ${nameClass}">${escapeHtml(entry.user_name || "")}</span>` +
    `<span class="text">${escapeHtml(entry.text || "")}</span>`;

  feed.appendChild(div);
  while (feed.children.length > MAX_VISIBLE) feed.removeChild(feed.firstElementChild);
}

// --- Verbindung ----------------------------------------------------------------------
// Der Bot schickt, wir hören zu - wie bars.html. Bricht die Verbindung ab, wird sie wieder
// aufgebaut, ohne dass jemand die Quelle anfassen muss.
function connect() {
  const token = params.get("token") || "";
  const host = params.get("host") || "127.0.0.1";
  const port = params.get("port") || "4458";
  if (!token) { console.warn("Kein ?token= in der URL - keine Verbindung."); return; }

  const socket = new WebSocket(`ws://${host}:${port}/?token=${encodeURIComponent(token)}`);

  socket.onopen = () => document.getElementById("link").classList.add("ok");
  socket.onclose = () => {
    document.getElementById("link").classList.remove("ok");
    setTimeout(connect, 3000);
  };
  socket.onerror = () => socket.close();
  socket.onmessage = (message) => {
    let frame;
    try { frame = JSON.parse(message.data); } catch { return; }
    if (frame.type === "history") {
      feed.innerHTML = "";
      for (const entry of frame.data || []) addMessage(entry);
    } else if (frame.type === "message") {
      addMessage(frame.data);
    } else if (frame.type === "clear") {
      feed.innerHTML = "";
    }
  };
}

// --- Start -----------------------------------------------------------------------------
if (params.get("demo") === "1") {
  const sample = [
    { id: 1, platform: "twitch", user_name: "Kevin", text: "moin moin! 👋" },
    { id: 2, platform: "twitch", user_name: "ModDoro", text: "willkommen im Stream", is_privileged: true },
    { id: 3, platform: "discord", user_name: "Lenaa", text: "das Overlay sieht super aus", is_subscriber: true },
    { id: 4, platform: "twitch", user_name: "xX_Gamer_Xx", text: "wie heißt der Boss nochmal?" },
    { id: 5, platform: "twitch", user_name: "Kevin", text: "PogChamp PogChamp" },
  ];
  for (const entry of sample) addMessage(entry);
} else {
  connect();
}
</script>
