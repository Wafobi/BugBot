<meta charset="utf-8">
<title>BugBot Companion — Vorschau</title>

<!--
  Zum Anschauen im normalen Browser, ohne Bot und ohne OBS. Einfach öffnen:

    file:///pfad/zu/bugbot/features/companion/client/preview.html

  companion.html füllt, wie chat.html, die Größe seiner Quelle statt eines festen Canvas -
  die Vorschau lässt deshalb Breite und Höhe selbst wählen, statt zu skalieren, und legt ein
  Spielbild-Ersatzbild dahinter, damit sich die Lesbarkeit über bewegtem Bild beurteilen lässt.

  Alle Parameter von companion.html funktionieren auch hier und werden durchgereicht.
-->

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e0f14; color: #cfd6e0; overflow: hidden; height: 100vh;
    font: 14px/1.5 system-ui, sans-serif;
  }

  #bar {
    position: fixed; inset: 0 0 auto 0; z-index: 10; height: 46px;
    display: flex; align-items: center; gap: 18px; padding: 0 16px;
    background: #16181f; border-bottom: 1px solid #262a34;
  }
  #bar label { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  #bar input[type=text], #bar input[type=number] {
    background: #0e0f14; color: #cfd6e0; border: 1px solid #333846;
    border-radius: 5px; padding: 4px 7px; font: inherit;
  }
  #bar input[type=number] { width: 70px; }
  #bar input[type=text] { width: 220px; }
  #bar .hint { margin-left: auto; opacity: .5; font-size: 12px; }

  #wrap {
    position: absolute; inset: 46px 0 0 0;
    display: flex; align-items: center; justify-content: center;
    overflow: auto;
  }
  #stage {
    position: relative; flex: none;
    background:
      radial-gradient(circle at 30% 30%, #6b4b2a 0%, transparent 42%),
      radial-gradient(circle at 72% 68%, #2b4a63 0%, transparent 48%),
      linear-gradient(155deg, #3a3227 0%, #1b232b 55%, #241d29 100%);
    box-shadow: 0 0 0 1px #262a34, 0 18px 60px rgba(0, 0, 0, .6);
  }
  #frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
</style>

<div id="bar">
  <label>Breite <input type="number" id="w" value="1280" step="10"></label>
  <label>Höhe <input type="number" id="h" value="360" step="10"></label>
  <label>Größe <input type="number" id="size" value="96" step="4"></label>
  <label>Max. Companions <input type="number" id="max" value="24" step="1"></label>
  <label>weitere Parameter <input type="text" id="extra" placeholder="t.name-size=20px"></label>
  <span class="hint">companion.html?demo=1 &middot; alle Parameter werden durchgereicht</span>
</div>

<div id="wrap"><div id="stage"><iframe id="frame"></iframe></div></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const incoming = new URLSearchParams(location.search);

if (incoming.has("size")) $("size").value = incoming.get("size");
if (incoming.has("max")) $("max").value = incoming.get("max");
{
  const rest = new URLSearchParams(incoming);
  ["size", "max", "demo"].forEach((k) => rest.delete(k));
  $("extra").value = decodeURIComponent(rest.toString().replace(/&/g, "&"));
}

function build() {
  const params = new URLSearchParams("demo=1");
  params.set("size", $("size").value || "96");
  params.set("max", $("max").value || "24");

  let query = params.toString();
  const extra = $("extra").value.trim().replace(/^[?&]+/, "");
  if (extra) query += "&" + extra;

  $("frame").src = "companion.html?" + query;
  $("stage").style.width = ($("w").value || 1280) + "px";
  $("stage").style.height = ($("h").value || 360) + "px";
}

for (const id of ["w", "h", "size", "max", "extra"]) {
  $(id).addEventListener(id === "extra" ? "change" : "input", build);
}
build();
</script>
