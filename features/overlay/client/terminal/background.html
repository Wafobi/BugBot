<title>Terminal Background</title>

<!--
  The ground the frame stands on: a full-bleed background for a scene that
  has nothing else behind it. Its own browser source, meant to sit at the
  *bottom* of the scene list, under the capture and under video.html.

  Fills the whole browser source, so its size comes from OBS. Built from
  gradients only - no image file, and it recolours with ?theme= because
  every accent goes through the same four tokens the rest of this folder
  uses (--amber, --amber-soft, --amber-dim, --glow).

  Parameters (all optional):

    theme=     load themes/<name>.css - see themes/README.md. The same
               file video.html, chat.html and tubbi.html load
    pattern=   grid (default) | dots | lines | plain
    scanlines=0  drop the scanlines
    vignette=0   drop the vignette
    t.NAME=    override any single design token from :root below:
                 ?t.grid=96px          coarser grid / wider dot spacing
                 ?t.pattern-alpha=.5   stronger or fainter pattern
                 ?t.line-w=1px         thinner grid lines / hachure
                 ?t.dot-r=4px          bigger dots
                 ?t.ground=#07100e     a different base colour
                 ?t.glow-size=70%      how far the glow reaches

  No spaces in values (rgba(4,5,14,1) survives a URL, "rgba(4, 5, 14, 1)"
  tears the query apart).
-->

<style>
  :root {
    /* Same four accent tokens as everything else in this folder, so one
       ?theme= file covers the frame and its ground together. */
    --amber: #ffb000;
    --amber-soft: #d99a3d;
    --amber-dim: #8a6a34;
    --glow: rgba(255, 176, 0, 0.35);

    --ground: #0a0705;
    --ground-deep: #060504;
    --grid: 64px;
    /* Thicker and stronger than looks right on a monitor on purpose: a 1px
       hairline at 15% is the first thing x264 throws away, and the OBS
       preview scales it out of existence before that. */
    --line-w: 2px;
    --dot-r: 2.4px;
    --pattern-alpha: .3;
    --glow-size: 62%;
    --vignette: 200px;
    --vignette-alpha: .5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    /* Opaque on purpose: this one is the bottom of the stack, everything
       else in the scene is composited over it. */
    background: var(--ground);
  }

  .ground {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(88% var(--glow-size) at 50% 6%, var(--glow) 0%, transparent 62%),
      radial-gradient(130% 100% at 50% 118%, var(--glow) 0%, transparent 58%),
      linear-gradient(180deg, #0d0a06 0%, var(--ground-deep) 62%, var(--ground) 100%);
  }

  /* The structure. Longhands rather than the background shorthand: a
     var() in the shorthand's <bg-size> slot parses differently across
     engines, and this has to survive OBS's CEF as well as a browser.
     The colour is var(--amber) at full strength - what makes it a texture
     rather than a fence is the element's own opacity, so a theme file
     recolours the pattern along with everything else. */
  .pattern {
    position: absolute;
    inset: 0;
    opacity: var(--pattern-alpha);
  }

  :root[data-pattern="grid"] .pattern {
    background-image:
      linear-gradient(var(--amber) var(--line-w), transparent var(--line-w)),
      linear-gradient(90deg, var(--amber) var(--line-w), transparent var(--line-w));
    background-size: 100% var(--grid), var(--grid) 100%;
  }
  :root[data-pattern="dots"] .pattern {
    background-image:
      radial-gradient(var(--amber) var(--dot-r), transparent calc(var(--dot-r) + 1px));
    background-size: var(--grid) var(--grid);
  }
  :root[data-pattern="lines"] .pattern {
    background-image: repeating-linear-gradient(
      45deg,
      var(--amber) 0,
      var(--amber) var(--line-w),
      transparent var(--line-w),
      transparent var(--grid));
  }

  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg, rgba(0,0,0,.22) 0px, rgba(0,0,0,.22) 1px, transparent 1px, transparent 3px);
  }
  .vignette {
    position: absolute; inset: 0;
    box-shadow: inset 0 0 var(--vignette) rgba(0, 0, 0, var(--vignette-alpha));
  }

  :root[data-scanlines="0"] .scanlines { display: none; }
  :root[data-vignette="0"] .vignette { display: none; }
</style>

<!-- ?theme=<name> loads themes/<name>.css - the same file video.html, chat.html and
     tubbi.html in this folder load. See themes/README.md. -->
<script>
(function () {
  var theme = new URLSearchParams(location.search).get("theme");
  if (!theme) return;
  var link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = "themes/" + encodeURIComponent(theme) + ".css";
  document.currentScript.insertAdjacentElement("afterend", link);
})();
</script>

<script>
(function () {
  /* Runs before the layers below paint, so the wrong pattern never shows
     up for a frame. ?t.<token>= lands as an inline style on the root and
     therefore beats the ?theme= file too. */
  var params = new URLSearchParams(location.search);
  var root = document.documentElement;

  var patterns = ["grid", "dots", "lines", "plain"];
  var pattern = (params.get("pattern") || "grid").toLowerCase();
  if (patterns.indexOf(pattern) === -1) {
    console.warn("Unbekanntes ?pattern=" + pattern + " - benutze grid.");
    pattern = "grid";
  }
  root.setAttribute("data-pattern", pattern);

  if (params.get("scanlines") === "0") root.setAttribute("data-scanlines", "0");
  if (params.get("vignette") === "0") root.setAttribute("data-vignette", "0");

  params.forEach(function (value, key) {
    if (key.indexOf("t.") === 0) root.style.setProperty("--" + key.slice(2), value);
  });
})();
</script>

<div class="ground"></div>
<div class="pattern"></div>
<div class="scanlines"></div>
<div class="vignette"></div>
