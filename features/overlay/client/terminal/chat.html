<title>Stream Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!--
  Parameters (all optional), same convention/names as bugbot's own
  features/overlay/client/chat.html - this page is a reskin of that one, wired to the
  same listener:

    token=   the bot's OVERLAY_TOKEN. Without it, no connection - the card
             just stays empty (no more random mock lines).
    host=    default 127.0.0.1 - the tunnel ends here, not at the server
    port=    default 4457 - same listener as the real bars.html/chat.html,
             stat bars and chat both go through it
    source=  which platform(s) to show, comma-separated: source=twitch or
             source=twitch,discord. Empty = everything the bot sends (default)
    demo=1   the old mock/randomized lines, no connection - for judging the
             layout without a bot running
    frame=0  drop the window around the chat: no titlebar, no border, no
             card background, no CRT overlay, no shell prompt. Only the
             chat lines are left, floating over whatever is behind them.
             They get a text shadow in exchange, because without the dark
             card the log has to stay readable over a bright picture too
    theme=   load themes/<name>.css - see themes/README.md
    avatar=NAME&avatartab=y,h,w&avatarslide=x&tabscenes=A,B   a tab growing sideways out
             of the card's right edge as the avatar's ground, the avatar sliding out
             with it, following the OBS source NAME in those scenes, which also take
             the Stream Deck keys there. dock=PC&dockrect=x,y,w,h: in those scenes the
             chat drops its card and sits in bars.html's ?chattab=. obs= / obspw= for
             obs-websocket. docked=1 forces the docked look without OBS (previews).
             Details: the script after the .stage div, and ../obs-tabs.js
    ttl=     seconds a chat line stays before it fades out (default 120, 0 = for ever)

    t.NAME=  override any single design token from :root below, e.g.
             ?t.bar-h-bottom=180px
             lands as an inline style on the root element, so it wins over
             every rule in the stylesheet regardless of load order.

  No spaces in values (rgba(4,5,14,1) survives a URL, "rgba(4, 5, 14, 1)"
  tears the query apart).
-->

<style>
  /*
    Design plan
    Its own OBS browser source, independent of the Vtubbi frame (tubbi.html
    next to it) so each can be moved/resized/toggled on its own - the
    letterbox chrome this used to share a file with (overlay.html) is gone,
    unused in this streamer's actual scene. Same fixed 2560x1440
    stage/position as tubbi.html so it lines up when stacked with it.
    Docked near the bottom but allowed to poke up a bit into the game area,
    kept compact (max lines visible) rather than a tall log.
    Chat    wired to bugbot's real overlay/chat_panel WebSocket (one listener,
            both bars.html's stat frames and this chat's history/message/clear
            frames) - see the connect() script below. ?demo=1 still gives the
            old random lines for judging the layout without a bot running.
  */

  :root {
    --ink: #15100a;
    --ink-deep: #0d0904;
    --ink-line: #2a1f10;
    --amber: #ffb000;
    --amber-soft: #d99a3d;
    --amber-dim: #8a6a34;
    --cyan: #6fe7dd;
    --green: #7cffb2;
    --red: #ff5f6d;
    --glow: rgba(255, 176, 0, 0.35);
    --font-display: "VT323", ui-monospace, "Courier New", monospace;
    --font-body: "IBM Plex Mono", ui-monospace, "SFMono-Regular", "Courier New", monospace, "Noto Color Emoji";
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent; /* composited over Game Capture in OBS */
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }


  /* Fixed 2560x1440 internal coordinate system (matches the OBS canvas),
     auto-scaled to fit whatever window this actually opens in — see the
     fitStage() script at the bottom. */
  .stage {
    position: absolute;
    top: 0; left: 0;
    width: 2560px;
    height: 1440px;
    transform-origin: top left;
  }

  /* ---------- shared terminal chrome (titlebar) ---------- */

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: #1c140a;
    border-bottom: 1px solid var(--ink-line);
    flex-shrink: 0;
  }
  .dots { display: flex; gap: 5px; flex-shrink: 0; }
  .dots span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--amber-dim);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.3);
  }
  .dots span:nth-child(1) { opacity: .55; }
  .dots span:nth-child(2) { opacity: .75; }
  .dots span:nth-child(3) { opacity: 1; background: var(--amber-soft); }
  .filename {
    flex: 1;
    font-size: 11px;
    color: var(--amber-dim);
    letter-spacing: .02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- chat frame ---------- */

  .chat-frame {
    position: absolute;
    left: 40px;
    bottom: 30px;
    width: 460px;
    height: 270px;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--ink) 0%, var(--ink-deep) 100%);
    border: 1px solid var(--ink-line);
    border-radius: 6px;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.4),
      0 14px 40px rgba(0, 0, 0, 0.5),
      0 0 30px var(--glow);
    overflow: hidden;
  }

  .chat-screen {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 10px 12px 9px;
  }
  .chat-screen::before {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg, rgba(255,176,0,.05) 0px, rgba(255,176,0,.05) 1px, transparent 1px, transparent 3px
    );
    mix-blend-mode: overlay;
    z-index: 2;
  }
  .chat-screen::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 40px rgba(0,0,0,.6);
    z-index: 2;
  }

  .chat-log {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 5px;
    font-size: 14px;
    line-height: 1.35;
  }
  .chat-line { display: flex; flex-wrap: wrap; gap: 0 5px; }
  .chat-user { font-weight: 600; flex-shrink: 0; }
  .chat-user::after { content: ":"; opacity: .6; }
  .chat-text { color: #e9d9b8; word-break: break-word; }
  /* Twitch emotes: as tall as a line and a bit, sitting on the text */
  /* ?ttl=: an expired line fades out, then goes (the script removes it) */
  .chat-line--gone { opacity: 0 !important; transition: opacity .8s ease; animation: none !important; }
  .chat-emote { height: 1.75em; width: auto; vertical-align: -.5em; margin: -.15em 1px; }
  .chat-line.system {
    color: var(--amber-dim);
    font-style: italic;
    justify-content: center;
    text-align: center;
    font-size: 10.5px;
  }

  .chat-input {
    margin-top: 7px;
    padding-top: 6px;
    border-top: 1px solid var(--ink-line);
    font-size: 10px;
    color: var(--amber-soft);
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* ?frame=0 - the window goes, the log stays. Everything that made the
     card an object is switched off in one place rather than being spread
     over the rules above, so the framed look stays the untouched default. */
  :root[data-frame="0"] .chat-frame {
    background: none;
    border-color: transparent;
    border-radius: 0;
    box-shadow: none;
  }
  :root[data-frame="0"] .titlebar { display: none; }
  :root[data-frame="0"] .chat-screen { padding: 0; }
  :root[data-frame="0"] .chat-screen::before,
  :root[data-frame="0"] .chat-screen::after { display: none; }
  /* The shell prompt goes with the window: it is part of the terminal
     fiction, and a prompt with no terminal around it reads as a leftover.
     Wanted back? Drop this one rule. */
  :root[data-frame="0"] .chat-input { display: none; }
  /* Without the dark card behind it, the shadow is what carries legibility -
     a bright picture underneath would otherwise swallow the text. */
  :root[data-frame="0"] .chat-log {
    text-shadow: 0 1px 3px rgba(0,0,0,.95), 0 0 10px rgba(0,0,0,.8);
  }

  /* ?avatartab=: a tab growing sideways out of the card's right edge - the ground the avatar stands
     on. Its own layer next to the card (the card clips its content); fill like the card,
     outline like the card's rim, which opens where the tab sits (--notch-l/-r). */
  .card-tab { position: absolute; pointer-events: none; z-index: 3; overflow: visible; }
  .card-tab .fill {
    position: absolute; inset: 0;
    background: color-mix(in srgb, var(--ink) calc(var(--chat-alpha, 1) * 100%), transparent);
    -webkit-backdrop-filter: blur(var(--chat-blur, 0px)); backdrop-filter: blur(var(--chat-blur, 0px));
  }
  .card-tab svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .card-tab path { fill: none; stroke: var(--tab-edge, var(--ember, var(--amber-dim))); stroke-width: 1.5;
                   opacity: var(--tab-edge-opacity, .75); }
  .chat-frame.has-tab::after {
    clip-path: polygon(0 0, 100% 0, 100% var(--notch-t, 0), calc(100% - 4px) var(--notch-t, 0),
                       calc(100% - 4px) var(--notch-b, 0), 100% var(--notch-b, 0), 100% 100%, 0 100%);
  }
  .card-tab { filter: drop-shadow(4px 0 14px var(--glow)); }

  /* ?dock=: in these scenes the chat has no card of its own - it sits in the bottom bar's
     tab (bars.html ?chattab=), only the lines, at ?dockrect=x,y,w,h. */
  :root[data-dock] .chat-frame {
    left: var(--dock-x) !important; top: var(--dock-y) !important; bottom: auto !important;
    width: var(--dock-w) !important; height: var(--dock-h) !important;
    background: none !important; border-color: transparent !important; box-shadow: none !important;
    -webkit-backdrop-filter: none !important; backdrop-filter: none !important;
  }
  :root[data-dock] .chat-frame::after, :root[data-dock] .titlebar, :root[data-dock] .card-tab { display: none !important; }
  :root[data-dock] .chat-screen { padding: 0; }
  :root[data-dock] .chat-screen::after { display: none; }
  :root[data-dock] .chat-log { text-shadow: 0 1px 3px rgba(0,0,0,.9); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }
</style>

<!-- ?theme=<name> loads themes/<name>.css - the same file tubbi.html in this folder loads
     for the same ?theme=. See themes/README.md. -->
<script>
(function () {
  var theme = new URLSearchParams(location.search).get("theme");
  if (!theme) return;
  var link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = "themes/" + encodeURIComponent(theme) + ".css";
  document.currentScript.insertAdjacentElement("afterend", link);
})();
</script>

<script>
(function () {
  /* ?t.<token>=<value> -> inline style on <html>, beats every stylesheet
     rule regardless of load order. Same convention as bars.html/chat.html.
     Runs before the stage below paints, so there's no flash of the
     un-overridden default. */
  var params = new URLSearchParams(location.search);
  var root = document.documentElement;
  if (params.get("frame") === "0") root.setAttribute("data-frame", "0");
  params.forEach(function (value, key) {
    if (key.indexOf("t.") === 0) root.style.setProperty("--" + key.slice(2), value);
  });
})();
</script>

<script>
(function () {
  /* Glass toggle from the Stream Deck: Bitfocus Companion's OBS module sends a "Custom Command"
       CallVendorRequest {"vendorName":"obs-browser","requestType":"emit_event",
                          "requestData":{"event_name":"wafobi-chat-glass","event_data":{"mode":"toggle"}}}
     and obs-browser hands it to every browser source as a window event. mode: toggle | glass |
     solid. Sets data-glass on <html>; what "glass" looks like is up to the theme (glut and the
     themes built on it: see --chat-glass-alpha / --chat-glass-blur). Remembered in localStorage,
     so a reload (OBS refreshing the source on scene change) keeps the state. */
  var root = document.documentElement, KEY = "wafobi-chat-glass";
  function set(on) {
    if (on) root.setAttribute("data-glass", "1"); else root.removeAttribute("data-glass");
    try { localStorage.setItem(KEY, on ? "1" : "0"); } catch (e) {}
  }
  try { if (localStorage.getItem(KEY) === "1") root.setAttribute("data-glass", "1"); } catch (e) {}
  window.addEventListener("wafobi-chat-glass", function (event) {
    var mode = (event.detail && event.detail.mode) || "toggle";
    set(mode === "glass" ? true : mode === "solid" ? false : !root.hasAttribute("data-glass"));
  });
})();
</script>

<div class="stage">
  <div class="chat-frame">
    <div class="titlebar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="filename">chat.log — #wafobitv</div>
    </div>
    <div class="chat-screen">
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input">wafobitv@twich.tv:~$ tail -f chat.log</div>
    </div>
  </div>
</div>

<script src="../obs-tabs.js"></script>
<script>
(function () {
  /* The avatar tab and the dock - both need to know the OBS program scene, so both go through
     obs-tabs.js (local obs-websocket, ?obs= port, ?obspw= password):
       avatar=NAME       the avatar source; avatartab=y,h,w / avatarslide=x - see below
       tabscenes=A,B     the scenes the avatar tab is used in; there this page also takes the
                         Stream Deck keys "wafobi-avatar" (tab first, then the avatar) and
                         "wafobi-chat" (the chat itself on/off)
       dock=PC           scenes where the chat sits in the bottom bar instead (bars.html
                         ?chattab=), at dockrect=x,y,w,h - no card, no title, only the lines */
  var params = new URLSearchParams(location.search);
  var list = function (name) { return (params.get(name) || "").split(",").map(function (x) { return x.trim(); }).filter(Boolean); };
  var root = document.documentElement, frame = document.querySelector(".chat-frame");
  var dock = list("dock"), rect = list("dockrect").map(Number);
  // docked=1: always docked, without OBS - for previews (vorschau.html)
  if (params.get("docked") === "1") root.setAttribute("data-dock", "1");
  if (rect.length === 4) ["x", "y", "w", "h"].forEach(function (k, i) { root.style.setProperty("--dock-" + k, rect[i] + "px"); });

  // avatartab=y,h,w: the tab grows sideways out of the card's right edge - y from the card's
  // top, h tall, w wide when out. avatarslide=x,scale: the avatar travels with it, left to
  // right from behind the card: this page moves the OBS source itself (its crop). x is the
  // source's left edge on screen when out, as if uncropped; scale its OBS scale (no bounding
  // box - with one, a crop rescales instead of cutting). The source sits at the card's right
  // edge, top-left aligned; its left part is cropped away up to there.
  var tab = null, link = null, arg = list("avatartab").map(Number), scenes = list("tabscenes");
  var slideArg = list("avatarslide").map(Number), slideX = slideArg[0], slideK = slideArg[1] || 1;
  if (arg.length === 3 && arg.every(isFinite)) {
    var ty = arg[0], th = arg[1], tw = arg[2], R = 22, F = 16;
    var layer = document.createElement("div");
    layer.className = "card-tab";
    layer.innerHTML = '<div class="fill"></div><svg><path></path></svg>';
    frame.insertAdjacentElement("afterend", layer);
    frame.classList.add("has-tab");
    var fill = layer.firstChild, path = layer.querySelector("path");
    var edgeX = frame.offsetLeft + frame.offsetWidth;          // the card's right edge on stage
    layer.style.left = (edgeX - 2) + "px";
    layer.style.top = frame.offsetTop + "px";
    layer.style.width = (tw + 4) + "px";
    layer.style.height = frame.offsetHeight + "px";
    var bx = 1.25, y0 = ty, y1 = ty + th, lastCrop = null;
    tab = ObsTabs.tween(function (t) {
      var d = tw * t, right = bx + d, r = Math.min(R, d / 2), f = Math.min(F, d / 2);
      var line = d < .5 ? "" :
        "M" + bx + " " + (y0 - f) + "Q" + bx + " " + y0 + " " + (bx + f) + " " + y0 + "H" + (right - r) +
        "Q" + right + " " + y0 + " " + right + " " + (y0 + r) + "V" + (y1 - r) +
        "Q" + right + " " + y1 + " " + (right - r) + " " + y1 + "H" + (bx + f) + "Q" + bx + " " + y1 + " " + bx + " " + (y1 + f);
      path.setAttribute("d", line);
      fill.style.clipPath = line ? "path('" + line + "H" + (bx - 1.5) + "V" + (y0 - f) + "Z')" : "path('M0 0Z')";
      frame.style.setProperty("--notch-t", line ? (y0 - f) + "px" : "0px");
      frame.style.setProperty("--notch-b", line ? (y1 + f) + "px" : "0px");
      // the avatar: its virtual left edge runs from tw left of its place to its place
      var item = link && avatarName && link.item(avatarName);
      // only in its own scenes - elsewhere the avatar has a place of its own
      if (isFinite(slideX) && item && scenes.indexOf(link.program) >= 0) {
        var crop = Math.round((edgeX - (slideX - tw * (1 - t))) / slideK);
        if (crop !== lastCrop) {
          lastCrop = crop;
          link.send("SetSceneItemTransform", { sceneName: link.program, sceneItemId: item.id,
            sceneItemTransform: { positionX: edgeX, cropLeft: crop } });
        }
      }
    }, 700);
    tab.slide = isFinite(slideX);
  }
  var avatarName = params.get("avatar");

  var avatar = params.get("avatar");
  if (!dock.length && !(tab && avatar)) { if (tab) tab.set(true, true); return; }
  var tabs = {}, keys = { "wafobi-chat": params.get("chat") || "Chat" };
  // the avatar key only with a tab - without one tubbi.html (the avatar frame) takes it
  if (tab && avatar) { tabs[avatar] = tab; keys["wafobi-avatar"] = avatar; }
  link = ObsTabs.follow({
    port: params.get("obs") || "4455", password: params.get("obspw") || "",
    scenes: scenes, tabs: tabs, keys: keys,
    onScene: function (scene) {
      if (dock.indexOf(scene) >= 0) root.setAttribute("data-dock", "1"); else root.removeAttribute("data-dock");
      setTimeout(function () { report(true); }, 50);
    },
  });

  // Docked, the bar's tab only grows as far as the lines need: this page tells bars.html where
  // the topmost line starts (stage y, the bottom of the screen when empty) - as an obs-browser
  // event "wafobi-chat-height" {top}, on every change and every 5 s for a freshly loaded bar.
  var log = document.getElementById("chatLog"), stage = document.querySelector(".stage"), lastTop = null;
  function report(force) {
    if (!root.hasAttribute("data-dock") || !link) return;
    var scale = stage.getBoundingClientRect().width / 2560 || 1;
    var first = log.firstElementChild;
    var top = first ? Math.round(first.getBoundingClientRect().top / scale) : 1440;
    if (!force && top === lastTop) return;
    lastTop = top;
    link.send("CallVendorRequest", { vendorName: "obs-browser", requestType: "emit_event",
      requestData: { event_name: "wafobi-chat-height", event_data: { top: top } } });
  }
  new MutationObserver(function () { requestAnimationFrame(function () { report(false); }); })
    .observe(log, { childList: true, subtree: true, characterData: true });
  setInterval(function () { report(true); }, 5000);
})();
</script>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var colors = ["var(--cyan)", "var(--green)", "var(--amber)", "var(--red)", "var(--amber-soft)"];

  var chatLog = document.getElementById("chatLog");
  var maxLines = 8;

  function hash(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h << 5) - h + str.charCodeAt(i);
    return h;
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // A wrapped message is taller than one row, so maxLines alone does not guarantee the
  // lines fit - without this the box just clips at the top and leaves a half line hanging
  // there. Drops the oldest whole lines until the rest fits, never `keep` (the line being
  // typed). Checked on every typed character, because a line only wraps partway through
  // typing. Same as platforms/obs/client/terminal/stream-boot.html/stream-end.html.
  function fitLog(keep) {
    var style = getComputedStyle(chatLog);
    var room = chatLog.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
    var gap = parseFloat(style.rowGap) || 0;
    function used() {
      var total = 0;
      for (var k = 0; k < chatLog.children.length; k++) total += chatLog.children[k].offsetHeight + (k ? gap : 0);
      return total;
    }
    while (chatLog.children.length > 1 && used() > room) {
      chatLog.removeChild(chatLog.firstElementChild === keep ? chatLog.children[1] : chatLog.firstElementChild);
    }
  }

  // One renderer for both the demo loop and the real connection - a name, a line of text,
  // and whether it should type itself out (a live arrival) or appear instantly (the history
  // batch on connect, or a demo line).
  // Twitch emotes: the bot sends their places in the text ([[id, start, end], ...], inclusive
  // code point positions); they become images from Twitch's emote CDN, everything else stays
  // text. upto = how many code points are shown (the typewriter); an emote appears whole.
  var EMOTE_URL = "https://static-cdn.jtvnw.net/emoticons/v2/{id}/default/dark/2.0";
  function fillText(el, text, emotes, upto, row) {
    var chars = Array.from(text), at = {};
    (emotes || []).forEach(function (e) {
      if (e && /^[\w-]+$/.test(String(e[0])) && e[1] >= 0 && e[2] < chars.length) at[e[1]] = e;
    });
    el.textContent = "";
    var buffer = "";
    for (var i = 0; i < Math.min(upto, chars.length); i++) {
      var e = at[i];
      if (!e) { buffer += chars[i]; continue; }
      if (buffer) { el.appendChild(document.createTextNode(buffer)); buffer = ""; }
      var img = document.createElement("img");
      img.className = "chat-emote";
      img.alt = chars.slice(e[1], e[2] + 1).join("");
      img.src = EMOTE_URL.replace("{id}", e[0]);
      img.onload = function () { fitLog(row); };
      el.appendChild(img);
      i = e[2];
    }
    if (buffer) el.appendChild(document.createTextNode(buffer));
  }

  // ?ttl=: seconds a line stays before it fades out and goes (default 120, 0 = for ever).
  // Aged by its arrival time from the bot (ts, unix seconds) where there is one, so a reload
  // does not bring the backlog back for another full round - otherwise from now.
  var ttl = params.has("ttl") ? Number(params.get("ttl")) : 120;
  function expire(row, ts) {
    if (!(ttl > 0)) return;
    var left = ttl * 1000 - (ts ? Date.now() - ts * 1000 : 0);
    setTimeout(function () {
      row.classList.add("chat-line--gone");
      setTimeout(function () { if (row.parentNode) row.parentNode.removeChild(row); }, 800);
    }, Math.max(0, left));
  }

  function addLine(name, text, animate, emotes, ts, id) {
    if (ttl > 0 && ts && Date.now() - ts * 1000 > ttl * 1000) return;   // already over
    var row = document.createElement("div");
    row.className = "chat-line";
    if (id != null) row.dataset.id = id;
    expire(row, ts);
    var colorIdx = Math.abs(hash(name)) % colors.length;
    row.innerHTML =
      '<span class="chat-user" style="color:' + colors[colorIdx] + '">' + escapeHtml(name) + '</span>' +
      '<span class="chat-text"></span>';
    chatLog.appendChild(row);
    while (chatLog.children.length > maxLines) chatLog.removeChild(chatLog.firstChild);

    var textEl = row.querySelector(".chat-text");
    var length = Array.from(text).length;
    // A theme can switch the typewriter off with --chat-typing: off (kaminfeuer does): the
    // line then appears whole and fades in. Read per line - the theme loads asynchronously.
    var noTyping = getComputedStyle(document.documentElement).getPropertyValue("--chat-typing").trim() === "off";
    if (animate && noTyping && !reduceMotion) row.classList.add("chat-line--fade");
    if (reduceMotion || !animate || noTyping) { fillText(textEl, text, emotes, length, row); fitLog(row); return; }
    var i = 0;
    (function type() {
      fillText(textEl, text, emotes, i, row);
      fitLog(row);
      i++;
      if (i <= length) setTimeout(type, 10 + Math.random() * 8);
    })();
  }

  function addSystemLine(text) {
    var row = document.createElement("div");
    row.className = "chat-line system";
    row.textContent = text;
    chatLog.appendChild(row);
    while (chatLog.children.length > maxLines) chatLog.removeChild(chatLog.firstChild);
    fitLog(row);
  }

  // --- Demo: the old mock/randomized lines, for judging the layout without a bot running ---
  function startDemo() {
    var entries = [
      { user: "teekesselchen",   text: "hackt sich grad durch die pacman deps" },
      { user: "null_pointer",    text: "F" },
      { user: "catgirl_dev",     text: "uwu bin da" },
      { user: "LurkerSupreme",   text: "erster" },
      { user: "glitch_witch",    text: "das terminal ist so cozy" },
      { user: "byte_sized",      text: "Kappa" },
      { user: "ctrl_alt_defeat", text: "W stream" },
      { user: "quantum_qwertz",  text: "sudo hype" },
      { user: "0x1A2B3C",        text: "⠋⠙⠹ lädt Hype-Level" },
      { user: "vim_over_emacs",  text: ":wq und bin dabei" },
      { user: "segfault_simone", text: "core dumped vor lachen" },
      { user: "root_toor",       text: "kann ich root werden?" },
      { user: "daemon_dana",     text: "läuft brav im Hintergrund mit" },
      { user: "pixel_pia",       text: "1440p sieht mega aus heute" },
      { user: "kernel_kalle",    text: "endlich Feierabend, passt perfekt" },
      { user: "async_anna",      text: "PogChamp" },
      { type: "system", text: "wafobitv ist jetzt live" },
      { type: "system", text: "kernel_kalle folgt jetzt" }
    ];
    var queue = [];
    var lastShown = null;

    function refillQueue() {
      var shuffled = entries.slice();
      for (var i = shuffled.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
      }
      if (lastShown && shuffled[0] === lastShown && shuffled.length > 1) {
        var k = 1 + Math.floor(Math.random() * (shuffled.length - 1));
        var t = shuffled[0]; shuffled[0] = shuffled[k]; shuffled[k] = t;
      }
      queue = queue.concat(shuffled);
    }

    function nextEntry() {
      if (queue.length === 0) refillQueue();
      var entry = queue.shift();
      lastShown = entry;
      return entry;
    }

    function tick() {
      var entry = nextEntry();
      if (entry.type === "system") addSystemLine(entry.text);
      else addLine(entry.user, entry.text, true);
      setTimeout(tick, 900 + Math.random() * 1700);
    }
    tick();
  }

  // --- Real connection: bugbot's overlay/chat_panel listener - one socket also carries
  // bars.html's/tubbi.html's own frames, this page just ignores the types it doesn't render. ---
  function connect() {
    var token = params.get("token") || "";
    var host = params.get("host") || "127.0.0.1";
    var port = params.get("port") || "4457";
    var sources = (params.get("source") || "")
      .split(",").map(function (s) { return s.trim().toLowerCase(); }).filter(Boolean);
    if (!token) { console.warn("Kein ?token= in der URL - keine Verbindung."); return; }

    function inScope(entry) {
      return !sources.length || sources.indexOf((entry.platform || "").toLowerCase()) !== -1;
    }

    var socket = new WebSocket("ws://" + host + ":" + port + "/?token=" + encodeURIComponent(token));
    socket.onclose = function () { setTimeout(connect, 3000); };
    socket.onerror = function () { socket.close(); };
    socket.onmessage = function (message) {
      var frame;
      try { frame = JSON.parse(message.data); } catch (e) { return; }
      if (frame.type === "history") {
        chatLog.innerHTML = "";
        (frame.data || []).forEach(function (entry) {
          if (inScope(entry)) addLine(entry.user_name || "", entry.text || "", false, entry.emotes, entry.ts, entry.id);
        });
      } else if (frame.type === "message") {
        if (inScope(frame.data)) addLine(frame.data.user_name || "", frame.data.text || "", true, frame.data.emotes, frame.data.ts, frame.data.id);
      } else if (frame.type === "clear") {
        chatLog.innerHTML = "";
        addSystemLine("chat cleared");
      } else if (frame.type === "remove") {
        // a ban/timeout: that user's lines go
        var ids = ((frame.data || {}).ids || []).map(String);
        Array.prototype.slice.call(chatLog.children).forEach(function (row) {
          if (ids.indexOf(row.dataset.id) !== -1) chatLog.removeChild(row);
        });
      }
      // "state"/"patch" - bars.html's/tubbi.html's half of the same socket - not rendered here.
    };
  }

  if (params.get("demo") === "1") startDemo();
  else connect();
})();
</script>

<script>
(function () {
  /* Scales the fixed 2560x1440 stage to fit whatever window this opens in.
     In OBS with the Browser Source set to exactly 2560x1440 this comes out
     to scale 1 and changes nothing. Opened directly in a normal browser it
     shrinks (and centers) the whole thing so the chat card isn't clipped
     by the viewport, since html/body deliberately don't scroll. */
  var stage = document.querySelector(".stage");
  function fit() {
    var scale = Math.min(window.innerWidth / 2560, window.innerHeight / 1440);
    var offsetX = (window.innerWidth - 2560 * scale) / 2;
    var offsetY = (window.innerHeight - 1440 * scale) / 2;
    stage.style.transform = "translate(" + offsetX + "px," + offsetY + "px) scale(" + scale + ")";
  }
  window.addEventListener("resize", fit);
  fit();
})();
</script>
