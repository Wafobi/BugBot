<meta charset="utf-8">
<title>BugBot Overlay</title>

<!--
  The browser source. Belongs on the OBS machine, not the server - like
  platforms/obs/obs_bridge.py it sits here because it belongs to its counterpart, and runs
  elsewhere.

  Setup: add a "Browser" source, width 2560, height 1440, position (0,0), and as URL the
  file with a token:

    file:///path/to/bugbot/features/overlay/client/bars.html?token=YOUR_OVERLAY_TOKEN

  Parameters (all optional):
    token=   the OVERLAY_TOKEN from the bot's .env. Without it, no data.
    port=    port of the tunnel on this machine (default 4457)
    host=    default 127.0.0.1 - the tunnel ends here, not at the server
    off=     hide parts, comma-separated: off=clock,deaths
    only=    the reverse - keep only these standing: only=game,viewers
             parts: top, bottom, uptime, game, viewers, clock,
                    deaths, ticker, last, cam
    bar=     height of the bars in pixels. 184 without a crop filter, 110 with (default 184)
    cam=     diameter of the camera ring (default 300). cam=0 hides it
    camx=    center of the ring, from the left (default 230)
    accent=  accent color, URL-encoded: %23FFE100 for #FFE100
    theme=   load themes/<name>.css - a second :root block overriding a handful of the
             tokens below (see themes/README.md for what a theme covers and the shipped
             ones). Without it: the look as it ships, below.
    t.NAME=  override any single design token, e.g. t.bar-line-h=4px
    tab=x,w,h  the top bar grows a tab downwards - from x, w wide, down to y=h - joined by
             soft fillets, the hairline following its outline. A calm ground under an
             avatar that sits on the bar, instead of a frame of its own. Fill: --bar-tab-bg
    chattab=x,w,h  the same out of the bottom bar, upwards to h above the bottom edge - the
             ground for the chat, which docks into it (terminal/chat.html ?dock=)
    avatar=NAME / chat=NAME  the OBS sources the two tabs follow: out only while that source
             is enabled in the program scene, and program is one of tabscenes=. Without
             them a tab is simply always out. Needs a local connection to obs-websocket:
    obs=     obs-websocket port (default 4455)   obspw=  its password (URL-encode # etc.)
    tabscenes=PC,...  the scenes this overlay is in. There it also takes the Stream Deck keys
             (obs-browser events "wafobi-avatar" / "wafobi-chat", mode toggle|show|hide):
             showing, the tab grows first and the source appears once it is out; hiding,
             the source goes first and the tab slides in after. See obs-tabs.js.
    pad=96   a gamepad at the left of the top bar, wobbling, 96 px high (pad=1: default
             size). Colours: --pad-a / --pad-b, glow --pad-glow-a / --pad-glow-b
    link=1   show the connection lamp, top right (default off)
    demo=1   sample data without a connection - for looking at it in a normal browser

  The design lives entirely in the tokens in :root below. Any single one of them can be
  changed from outside via ?t.<token>=<value> - that lands as an inline style on the root
  element and so beats every rule in the stylesheet.

  ?theme= is the middle layer between "the shipped look" and "one token at a time": a
  second, smaller :root block loaded as a <link>, restyling a handful of tokens together
  (accent, ink, the bar gradients, the hairline) rather than the geometry - which stays
  identical across themes, so bar=/cam=/camx= keep meaning what they mean regardless of
  which one is active. ?t.<token>= still beats it, same as it beats the shipped look.

  The ring is only a frame: the camera itself is an OBS source that sits *underneath* this
  one and gets cut round with Advanced Masks. The source's console (right-click ->
  Interact) reports the center and the diameter, so the camera can be placed on it without
  guessing.
-->

<style>
  /* --- The look ------------------------------------------------------------------------
     After the channel art: fog in indigo and carmine, lightning in electric cyan, magenta
     as the outline. Two colors carry everything, exactly like in the logo - cyan fills,
     magenta outlines.

     Every line here is a handle that can be turned from outside: ?t.<name>=<value> lands
     as an inline style on the root element and so beats everything here. The rules below
     stay unaffected by that - which is why the look can be changed, but the layout never
     taken apart. */
  :root {
    /* Dimensions */
    --bar: 184px;
    --pad: 40px;
    --gap: 32px;

    /* Type */
    --font: "Roboto", "DejaVu Sans", system-ui, sans-serif;
    --value-size: 46px;
    --value-small: 34px;
    --value-weight: 700;
    --label-size: 22px;
    --label-weight: 600;
    --label-spacing: .2em;
    --label-transform: uppercase;
    --ticker-size: 32px;
    /* Very faint: the logo glows, the numbers should only hint at that, not smear. */
    --text-shadow: 0 0 16px rgba(95, 234, 245, .16);

    /* Colors */
    --accent: #5FEAF5;
    /* ?pad= - the gamepad in the top bar: gradient and glow */
    --pad-a: #5FEAF5;
    --pad-b: #F22A80;
    --pad-glow-a: rgba(95, 234, 245, .38);
    --pad-glow-b: rgba(242, 42, 128, .32);
    --ink: #EAF7FF;
    --dim: rgba(234, 247, 255, .5);
    /* The carmine of the fog clouds - the live dot is one of the three places allowed to
       glow (the other two: the ring and the hairline). */
    --dot-live: #D6453A;
    --dot-glow: rgba(214, 69, 58, .85);
    --dot-off: #2A2C50;

    /* Bars. The second color is the inner edge, i.e. the one facing the game - that's
       where how heavy the bar reads gets decided. Too transparent, and a bright game
       picture shows through and makes it look washed out. */
    --bar-bg-top: linear-gradient(180deg, rgba(7, 8, 22, .97), rgba(10, 10, 30, .82));
    --bar-bg-bottom: linear-gradient(0deg, rgba(7, 8, 22, .97), rgba(10, 10, 30, .82));

    /* The edge in the logo's construction: cyan and magenta as a running tile.
     *
     * The gradient repeats every 240px and travels exactly that same 240px - which is why
     * the jump back is invisible. --bar-line-tile MUST match the tile width; if they drift
     * apart, it stutters once per lap. To change the pace, only touch the seconds in
     * --bar-line-anim.
     *
     * Why this many stops instead of the three obvious ones (cyan/magenta/cyan): three
     * produce a triangle wave. That is continuous in value, but not in *slope* - at every
     * color peak it flips instantly, and that kink travels through the picture as a hard
     * spike. The stops here follow a cosine curve instead, so the slope runs to zero at
     * the peaks and the change is smooth.
     * Regenerate with: w = (1 - cos(2*pi*t/240)) / 2, blend cyan -> magenta by w. */
    --bar-line-h: 2px;
    /* ?tab= - fill of the tab below the bar; it hangs over the game, so a bit denser */
    --bar-tab-bg: rgba(9, 10, 28, .88);
    --bar-line: repeating-linear-gradient(90deg,
                #5FEAF5 0px, rgba(105, 221, 237, .993) 20px, rgba(132, 186, 216, .975) 40px,
                rgba(168, 138, 187, .95) 60px, rgba(205, 90, 157, .925) 80px, rgba(232, 55, 136, .907) 100px,
                rgba(242, 42, 128, .9) 120px, rgba(232, 55, 136, .907) 140px, rgba(205, 90, 157, .925) 160px,
                rgba(168, 138, 186, .95) 180px, rgba(132, 186, 216, .975) 200px, rgba(105, 221, 237, .993) 220px,
                #5FEAF5 240px);
    --bar-line-opacity: .9;
    --bar-line-tile: 240px;
    --bar-line-anim: bar-line-run 8s linear infinite;
    /* Fades the line out toward the edges. Needed for a running tile, because the
       gradient can no longer bring its own fraying along. */
    --bar-line-mask: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
    /* Runs the opposite way, so the two edges don't read as a conveyor belt. */
    --bar-line-dir-bottom: reverse;

    /* The halftone grid from the corners of the channel art. A static gradient, costs the
       GPU nothing, and sits only on the bars - the game is in between them. */
    --fx: radial-gradient(rgba(95, 234, 245, .11) 1px, transparent 1.6px) 0 0 / 7px 7px;
    --fx-opacity: 1;

    /* Camera ring - cyan inside, magenta outside: the logo's outline, as a ring. */
    --cam: 300px;
    --camx: 230px;
    /* Radius of the hole the bottom bar leaves for the camera - a bit larger than the
       ring, so its edge doesn't get clipped. */
    --cam-cut: calc(var(--cam) / 2 + 10px);
    --cam-ring: var(--accent);
    --cam-ring-w: 3px;
    --cam-halo: 0 0 0 10px rgba(11, 12, 32, .85),
                0 0 30px rgba(95, 234, 245, .42),
                inset 0 0 24px rgba(11, 12, 32, .5);
    --cam-outer: rgba(242, 42, 128, .6);
    --cam-outer-w: 2px;
    --cam-gap: 20px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 2560px; height: 1440px;
    background: transparent;
    overflow: hidden;
    font-family: var(--font);
    color: var(--ink);
    text-shadow: var(--text-shadow);
    -webkit-font-smoothing: antialiased;
  }

  /* --- The two bars ----------------------------------------------------------------- */
  .bar {
    position: absolute; left: 0; right: 0;
    height: var(--bar);
    display: flex; align-items: center;
    padding: 0 var(--pad);
    gap: var(--gap);
  }
  .bar.top    { top: 0;    background: var(--bar-bg-top); }
  .bar.bottom { bottom: 0; background: var(--bar-bg-bottom); }

  /* Pattern layer, filled by a theme via --fx. */
  .bar::before {
    content: ""; position: absolute; inset: 0;
    background: var(--fx);
    opacity: var(--fx-opacity);
    pointer-events: none;
  }

  /* The hairline sits at the edge facing the game picture and is the one thing that makes
     the bar look intentional rather than leftover. */
  .bar::after {
    content: ""; position: absolute; left: 0; right: 0;
    height: var(--bar-line-h);
    background: var(--bar-line);
    -webkit-mask: var(--bar-line-mask);
    mask: var(--bar-line-mask);
    opacity: var(--bar-line-opacity);
    animation: var(--bar-line-anim);
  }
  .bar.top::after    { bottom: 0; }
  /* ?tab=: two layers over the (unchanged) top bar - the tab's fill below the bar, and the
     hairline as a band of line width along the whole outline, which replaces the bar's own
     straight line. The script morphs both: the tab grows out of the bar and slides back in;
     at depth 0 the outline is exactly the straight bar edge, so nothing ever jumps. */
  .tab-fill, .tab-edge { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none; }
  .tab-fill { z-index: 1; }
  .tab-edge { z-index: 2; background: var(--bar-line); opacity: var(--bar-line-opacity); animation: var(--bar-line-anim); }
  .bar.has-tab::after { display: none; }
  .tab-layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .tab-layer.flip { transform: scaleY(-1); }
  .tab-layer.flip .tab-edge { animation-direction: var(--bar-line-dir-bottom); }
  /* the chat tab follows the chat's glass switch (event "wafobi-chat-glass", see
     terminal/chat.html): see-through and blurred instead of solid, faded */
  @property --chat-alpha { syntax: "<number>"; inherits: true; initial-value: 1; }
  @property --chat-blur { syntax: "<length>"; inherits: true; initial-value: 0px; }
  :root { --chat-alpha: 1; --chat-blur: 0px; --chat-glass-alpha: .45; --chat-glass-blur: 6px;
          transition: --chat-alpha .6s ease, --chat-blur .6s ease; }
  :root[data-glass="1"] { --chat-alpha: var(--chat-glass-alpha); --chat-blur: var(--chat-glass-blur); }
  .tab-layer.flip .tab-fill {
    --tab-bg: color-mix(in srgb, var(--bar-tab-bg) calc(var(--chat-alpha) * 100%), transparent);
    -webkit-backdrop-filter: blur(var(--chat-blur)); backdrop-filter: blur(var(--chat-blur));
  }
  .bar.bottom::after { top: 0; animation-direction: var(--bar-line-dir-bottom); }

  /* Shifts the pattern by exactly one tile - which makes the jump back read as a
     continuation. Only the background position of a 2px strip moves, not geometry: no
     layout, no reflow. */
  @keyframes bar-line-run {
    from { background-position-x: 0; }
    to   { background-position-x: var(--bar-line-tile); }
  }

  /* The bar gets a hole where the camera sits.
     Needed because the camera is an OBS source *underneath* this page: without the hole,
     the semi-transparent bar background would lie over its bottom half and darken it. The
     center sits on the bar's top edge, i.e. y=0 in its own coordinate system - exactly
     where the ring crosses that edge. As a side effect the hairline gets its notch too,
     which makes the ring look set into the bar rather than stuck on top of it. */
  .bar.bottom {
    -webkit-mask: var(--bar-mask, none);
    mask: var(--bar-mask, none);
  }
  :root {
    --bar-mask: radial-gradient(circle at var(--camx) 0,
                transparent var(--cam-cut), #000 calc(var(--cam-cut) + 2px));
    /* The left-hand space in the bottom bar that the ring claims. A token of its own, so
       ?cam=0 can take it back - otherwise an empty gap would stay standing there. */
    --bottom-pad: calc(var(--camx) + var(--cam) / 2 + 48px);
  }

  /* space-between only kicks in once the ticker is switched off: as long as it's there,
     its flex:1 soaks up the free space anyway. Without this line, the death counter and
     the last follower would both stick to the left. */
  .bottom { padding-left: var(--bottom-pad); justify-content: space-between; }

  .spacer { flex: 1; }

  /* --- Parts -------------------------------------------------------------------------- */
  .block { display: flex; align-items: baseline; gap: 14px; white-space: nowrap; }
  .label {
    font-size: var(--label-size); font-weight: var(--label-weight);
    letter-spacing: var(--label-spacing); text-transform: var(--label-transform);
    color: var(--dim);
  }
  .value { font-size: var(--value-size); font-weight: var(--value-weight); line-height: 1; }
  .value.accent { color: var(--accent); }
  .value.small  { font-size: var(--value-small); font-weight: 600; }

  /* Live dot: pulses only via opacity, which costs the GPU next to nothing. */
  .dot {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--dot-live); align-self: center;
    box-shadow: 0 0 18px var(--dot-glow);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .dot.off { background: var(--dot-off); box-shadow: none; animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }

  /* --- Ticker --------------------------------------------------------------------- */
  #ticker {
    flex: 1; overflow: hidden; text-align: center;
    font-size: var(--ticker-size); font-weight: 500; color: var(--dim);
  }
  #ticker b { color: var(--accent); font-weight: 700; }
  #ticker > span {
    display: inline-block;
    transition: opacity .5s ease, transform .5s ease;
  }
  #ticker > span.out { opacity: 0; transform: translateY(-12px); }

  /* --- Camera ring ---------------------------------------------------------------- */
  /* Just a frame. The inside stays fully transparent, so the camera source sitting
     underneath it is visible. */
  #cam {
    position: absolute;
    /* Above the bars: the ring crosses their edge, and whatever crosses that edge must
       not be painted over by it. */
    z-index: 3;
    left: var(--camx); bottom: var(--bar);
    width: var(--cam); height: var(--cam);
    transform: translate(-50%, 50%);
    border-radius: 50%;
    border: var(--cam-ring-w) solid var(--cam-ring);
    box-shadow: var(--cam-halo);
  }
  /* A second, thinner ring outside - turns the circle into a frame instead of a line. */
  #cam::after {
    content: ""; position: absolute; inset: calc(var(--cam-gap) * -1);
    border-radius: 50%; border: var(--cam-outer-w) solid var(--cam-outer);
  }

  /* ?pad=: a gamepad at the left of the top bar, wobbling gently - the same shape as on the
     screens (terminal themes), in a gradient from --pad-a to --pad-b. Decoration only, not a
     data-part (so ?only=top,bottom keeps it). */
  .bar-pad { position: absolute; left: var(--pad); top: 50%; z-index: 3; pointer-events: none;
             height: var(--pad-h, 96px); width: calc(var(--pad-h, 96px) * 64 / 50); margin-top: calc(var(--pad-h, 96px) / -2);
             filter: drop-shadow(-2px -1px 6px var(--pad-glow-a)) drop-shadow(2px 1px 6px var(--pad-glow-b));
             animation: bar-pad-bob 3.2s ease-in-out infinite; }
  .bar-pad svg { width: 100%; height: 100%; display: block; overflow: visible; }
  @keyframes bar-pad-bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-5px) rotate(3deg); } }
  @media (prefers-reduced-motion: reduce) { .bar-pad { animation: none; } }

  /* Connection lamp, only interesting while setting up: visible with ?link=1, otherwise
     not. Off by default, because a red dot in the corner would otherwise sit right in the
     picture exactly when the bot restarts mid-stream. That the connection is missing is
     visible anyway: uptime reads "offline" and the viewer count reads "—". */
  #link { display: none; }
  #link.shown {
    display: block;
    position: absolute; right: 6px; top: 6px; z-index: 4;
    width: 8px; height: 8px; border-radius: 50%;
    background: #FF3B30; opacity: .5;
  }
  #link.ok { background: #34C759; }
</style>

<!-- ?theme=<name> loads themes/<name>.css right here - after the :root block above, so its
     rules win on equal specificity, and before every script below, so a ?t.<token>= later in
     the URL still beats it (inline style always wins regardless of load order - see the
     precedence note in README.md). No theme means no request, no extra file. -->
<script>
(function () {
  var theme = new URLSearchParams(location.search).get("theme");
  if (!theme) return;
  var link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = "themes/" + encodeURIComponent(theme) + ".css";
  document.currentScript.insertAdjacentElement("afterend", link);
})();
</script>

<!-- data-part is the name a part can be switched on/off by:
     ?off=clock,deaths hides it, ?only=game,viewers keeps only those standing. -->
<div class="bar top" data-part="top">
  <div class="block" data-part="uptime"><span class="dot off" id="dot"></span><span class="value small" id="uptime">--:--:--</span></div>
  <div class="spacer"></div>
  <div class="block" data-part="game"><span class="value" id="game">—</span></div>
  <div class="spacer"></div>
  <div class="block" data-part="viewers"><span class="label">Zuschauer</span><span class="value accent" id="viewers">0</span></div>
  <div class="block" data-part="clock"><span class="value small" id="clock">--:--</span></div>
</div>

<div id="cam" data-part="cam"></div>

  <defs><linearGradient id="padGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset=".1" style="stop-color: var(--pad-a)"/><stop offset=".9" style="stop-color: var(--pad-b)"/></linearGradient></defs>
  <path fill="url(#padGrad)" fill-rule="evenodd" d="M14,18 C18,14 46,14 50,18 C56,21 61,34 61,43 C61,51 55,53 51,49 L45,42 C42,40 22,40 19,42 L13,49 C9,53 3,51 3,43 C3,34 8,21 14,18 ZM13.8,26a4.2,4.2 0 1,0 8.4,0a4.2,4.2 0 1,0 -8.4,0zM23.6,29.8h2.8v2.8000000000000003h2.8000000000000003v2.8h-2.8000000000000003v2.8000000000000003h-2.8v-2.8000000000000003h-2.8000000000000003v-2.8h2.8000000000000003zM35.4,34a3.6,3.6 0 1,0 7.2,0a3.6,3.6 0 1,0 -7.2,0zM44.2,22a1.8,1.8 0 1,0 3.6,0a1.8,1.8 0 1,0 -3.6,0zM48.2,26a1.8,1.8 0 1,0 3.6,0a1.8,1.8 0 1,0 -3.6,0zM44.2,30a1.8,1.8 0 1,0 3.6,0a1.8,1.8 0 1,0 -3.6,0zM40.2,26a1.8,1.8 0 1,0 3.6,0a1.8,1.8 0 1,0 -3.6,0z"/></svg></div></template>

<div class="bar bottom" data-part="bottom">
  <div class="block" data-part="deaths"><span class="label">Tode</span><span class="value accent" id="deaths">0</span></div>
  <div id="ticker" data-part="ticker"><span></span></div>
  <div class="block" data-part="last"><span class="label" id="lastLabel">Zuletzt</span><span class="value small" id="last">—</span></div>
</div>

<script src="obs-tabs.js"></script>
<script>
"use strict";

const params = new URLSearchParams(location.search);
const root = document.documentElement.style;

// --- Design -------------------------------------------------------------------------
// Layer 3 of the design (see the comment up top): everything here lands as an inline
// style on the root element and so beats both :root and the theme file - regardless of
// when that finishes loading.

// Convenient short names for what gets turned most often.
const ALIASES = { bar: "--bar", cam: "--cam", camx: "--camx", accent: "--accent" };
for (const [name, token] of Object.entries(ALIASES)) {
  if (!params.has(name)) continue;
  const raw = params.get(name);
  // Dimensions may be written without a unit; colors are passed through untouched.
  root.setProperty(token, /^-?\d+$/.test(raw) ? raw + "px" : raw);
}

// And the general path: ?t.<token>=<value> for any token from :root, including the ones
// with no short name. That way a new knob never needs a new parameter.
for (const [name, value] of params) {
  if (name.startsWith("t.") && name.length > 2) root.setProperty("--" + name.slice(2), value);
}

// --- Switching parts on and off -------------------------------------------------------
// Every part carries a data-part. ?off=a,b hides it, ?only=a,b keeps only those standing.
// The two bars count too ("top", "bottom"), but rarely need naming: a bar with nothing
// left visible in it disappears on its own.
const PARTS = ["top", "bottom", "uptime", "game", "viewers", "clock",
               "deaths", "ticker", "last", "cam"];
const BARS = ["top", "bottom"];

const list = (name) => (params.get(name) || "").split(",").map(s => s.trim()).filter(Boolean);
const hidden = new Set(list("off"));

const only = list("only");
if (only.length) {
  // The bars are deliberately left out here: whoever writes ?only=clock means the clock
  // *inside* the top bar, not the clock without it. Whatever is left empty gets cleaned
  // up by the rule below.
  for (const part of PARTS) {
    if (!BARS.includes(part) && !only.includes(part)) hidden.add(part);
  }
}

// Naming a bar means: I want it, even empty. Without this exception, ?only=top,bottom -
// the bare bars as a frame - would be unreachable, because the cleanup rule below would
// remove them again for lack of content.
const keepEmpty = new Set(only.filter(part => BARS.includes(part)));

// cam=0 stays as its own switch because it's documented and stays shorter.
if (params.get("cam") === "0") hidden.add("cam");

for (const element of document.querySelectorAll("[data-part]")) {
  if (hidden.has(element.dataset.part)) element.style.display = "none";
}

// A bar with no visible content left is just a dark area - it goes too, unless it was
// explicitly requested.
for (const bar of document.querySelectorAll(".bar")) {
  if (keepEmpty.has(bar.dataset.part)) continue;
  const parts = [...bar.querySelectorAll("[data-part]")];
  if (!parts.some(element => element.style.display !== "none")) bar.style.display = "none";
}

// Without the ring, both things that exist only for its sake fall away too: the hole in
// the bar - otherwise a circle of game picture would sit there in the middle of a dark
// area - and the space kept clear on the left, which would otherwise leave an empty gap.
if (hidden.has("cam")) {
  root.setProperty("--bar-mask", "none");
  root.setProperty("--bottom-pad", "var(--pad)");
}

// --- Tabs (?tab= under the avatar, ?chattab= around the chat) -----------------------------
// Two layers per tab over the unchanged bar: .tab-fill (the tab beyond the bar, clipped to "bar
// + rounded tab") and .tab-edge (a band of line width along that outline - outer outline minus
// inner, even-odd - filled with the very same --bar-line, so it runs and fades like the
// straight one, which the tab replaces). The bottom bar's tab is the same shape drawn in a
// vertically mirrored layer. Animation and the OBS link: obs-tabs.js.
const TAB_MS = 700;
function barTab(bar, arg, bottom) {
  const [x0, w, h] = (arg || "").split(",").map(Number), x1 = x0 + w;
  if (![x0, w, h].every(Number.isFinite) || bar.style.display === "none") return null;
  const b = parseFloat(getComputedStyle(bar).height);
  if (h <= b) return null;
  const L = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--bar-line-h")) || 2;
  const W = document.body.clientWidth || 2560;
  const R = 28, F = 20;
  const layer = document.createElement("div"), fill = document.createElement("div"), edge = document.createElement("div");
  layer.className = "tab-layer" + (bottom ? " flip" : "");
  fill.className = "tab-fill"; edge.className = "tab-edge";
  fill.style.background = `linear-gradient(transparent ${b}px, var(--tab-bg, var(--bar-tab-bg)) ${b}px)`;
  // the edge fades like the bar's own line, but not over the tab itself
  const from = Math.max(0, x0 / W * 100 - 8), to = Math.min(100, x1 / W * 100 + 8);
  const mask = `linear-gradient(90deg, transparent, #000 ${Math.min(10, from)}%, #000 ${Math.max(90, to)}%, transparent)`;
  edge.style.webkitMask = edge.style.mask = mask;
  layer.append(fill, edge);
  bar.classList.add("has-tab");
  bar.insertAdjacentElement("afterend", layer);

  // The outline at a given depth d of the tab (0 = flat bar edge, h-b = full tab). g moves the
  // outline inwards (negative) for the inner edge of the line. Fillet and corner radii shrink
  // with the depth, so every in-between frame is a clean shape.
  const outline = (d, g) => {
    const bot = b + d, r = Math.min(R, d / 2), f = Math.min(F, d / 2);
    if (d < 0.5) return `M0 0H${W}V${b + g}H0Z`;
    return `M0 0H${W}V${b + g}H${x1 + f}Q${x1 + g} ${b + g} ${x1 + g} ${b + f}` +
           `V${bot - r}Q${x1 + g} ${bot + g} ${x1 - r} ${bot + g}H${x0 + r}Q${x0 - g} ${bot + g} ${x0 - g} ${bot - r}` +
           `V${b + f}Q${x0 - g} ${b + g} ${x0 - f} ${b + g}H0Z`;
  };
  return ObsTabs.tween((t) => {
    const d = (h - b) * t;
    fill.style.height = (b + d + 1) + "px";
    fill.style.clipPath = `path('${outline(d, 0)}')`;
    edge.style.height = (b + d + 2) + "px";
    edge.style.clipPath = `path(evenodd, '${outline(d, 0)} ${outline(d, -L)}')`;
  }, TAB_MS);
}
{
  const tabs = {}, keys = {};
  const avatarTab = barTab(document.querySelector(".bar.top"), params.get("tab"), false);
  const chatTab = barTab(document.querySelector(".bar.bottom"), params.get("chattab"), true);
  const avatar = params.get("avatar"), chat = params.get("chat");
  for (const [tab, source, key] of [[avatarTab, avatar, "wafobi-avatar"], [chatTab, chat, "wafobi-chat"]]) {
    if (!tab) continue;
    if (source) { tabs[source] = tab; keys[key] = source; } else tab.set(true, true);
  }
  if (chatTab && chat) {
    // Only as far out as the chat needs: terminal/chat.html (docked) reports where its topmost
    // line starts; while everything fits into the bar there is no tab at all.
    const [, , h] = params.get("chattab").split(",").map(Number);
    const b = parseFloat(getComputedStyle(document.querySelector(".bar.bottom")).height);
    chatTab.level = 0;
    window.addEventListener("wafobi-chat-height", (event) => {
      const top = Number(event.detail && event.detail.top);
      if (!Number.isFinite(top)) return;
      const need = 1440 - top + 18 - b;               // 18: room above the topmost line
      chatTab.setLevel(need < 10 ? 0 : Math.min(1, need / (h - b)));
    });
  }
  if (chatTab) {
    // same switch and same remembered state as terminal/chat.html
    const KEY = "wafobi-chat-glass", html = document.documentElement;
    const set = (on) => {
      if (on) html.setAttribute("data-glass", "1"); else html.removeAttribute("data-glass");
      try { localStorage.setItem(KEY, on ? "1" : "0"); } catch (e) {}
    };
    try { if (localStorage.getItem(KEY) === "1") html.setAttribute("data-glass", "1"); } catch (e) {}
    window.addEventListener("wafobi-chat-glass", (event) => {
      const mode = (event.detail && event.detail.mode) || "toggle";
      set(mode === "glass" ? true : mode === "solid" ? false : !html.hasAttribute("data-glass"));
    });
  }
  if (Object.keys(tabs).length) {
    ObsTabs.follow({
      port: params.get("obs") || "4455", password: params.get("obspw") || "",
      scenes: list("tabscenes"), tabs, keys,
    });
  }
}

// ?pad=<height>: the wobbling gamepad at the left of the top bar (see .bar-pad)
if (params.has("pad") && document.querySelector(".bar.top").style.display !== "none") {
  const h = parseInt(params.get("pad"), 10);
  if (h >= 20) root.setProperty("--pad-h", h + "px");     // smaller (pad=1): the default size
  document.querySelector(".bar.top").appendChild(document.getElementById("padArt").content.cloneNode(true));
}

if (params.get("link") === "1") document.getElementById("link").classList.add("shown");

const $ = (id) => document.getElementById(id);

// The state as the bot sends it. The starting values are the same fields as in
// features/overlay/feature.py - whatever gets added there only needs rendering here.
let state = {
  live: false, started_at: null, title: "", game: "",
  viewers: 0, last_follower: "", last_sub: "", last_raid: "", deaths: 0, commands: [],
};

// --- Rendering -----------------------------------------------------------------------
// One pass draws everything. With this handful of fields, diffing isn't worth it, and
// nothing can drift out of sync.
function render() {
  $("dot").className = "dot" + (state.live ? "" : " off");
  $("viewers").textContent = state.live ? state.viewers : "—";
  $("deaths").textContent = state.deaths;
  $("game").textContent = state.game || state.title || "—";

  const [label, who] = state.last_raid ? ["Raid", state.last_raid]
                     : state.last_sub  ? ["Letzter Sub", state.last_sub]
                     : state.last_follower ? ["Letzter Follow", state.last_follower]
                     : ["Zuletzt", "—"];
  $("lastLabel").textContent = label;
  $("last").textContent = who;
}

function renderUptime() {
  if (!state.live || !state.started_at) { $("uptime").textContent = "offline"; return; }
  const total = Math.max(0, Math.floor(Date.now() / 1000 - state.started_at));
  const pad = (n) => String(n).padStart(2, "0");
  $("uptime").textContent =
    `${pad(Math.floor(total / 3600))}:${pad(Math.floor(total / 60) % 60)}:${pad(total % 60)}`;
}

function renderClock() {
  $("clock").textContent = new Date().toLocaleTimeString("de-DE",
    { hour: "2-digit", minute: "2-digit" });
}

// --- Ticker ---------------------------------------------------------------------------
// Cycles through the commands open to an ordinary viewer. Which ones those are is decided
// by the bot (mod_only is already filtered out there).
let tickIndex = 0;
function tick(immediate) {
  const list = state.commands || [];
  const slot = $("ticker").firstElementChild;
  if (!list.length) { slot.innerHTML = ""; return; }

  const show = () => {
    const command = list[tickIndex++ % list.length];
    slot.innerHTML = command.help
      ? `<b>${escapeHtml(command.name)}</b> — ${escapeHtml(command.help)}`
      : `<b>${escapeHtml(command.name)}</b>`;
    slot.classList.remove("out");
  };

  // No fade-out the first time: otherwise the spot sits empty for half a second, and
  // that's exactly what's visible when the scene is freshly shown.
  if (immediate) return show();
  slot.classList.add("out");
  setTimeout(show, 500);
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// --- Connection ------------------------------------------------------------------------
// The bot sends, we listen. If the connection drops, it reconnects on its own - an
// overlay has to survive a bot restart mid-stream without anyone having to touch the
// source.
function connect() {
  const token = params.get("token") || "";
  const host = params.get("host") || "127.0.0.1";
  const port = params.get("port") || "4457";
  if (!token) { console.warn("Kein ?token= in der URL - keine Verbindung."); return; }

  const socket = new WebSocket(`ws://${host}:${port}/?token=${encodeURIComponent(token)}`);

  socket.onopen = () => $("link").classList.add("ok");
  socket.onclose = () => {
    $("link").classList.remove("ok");
    setTimeout(connect, 3000);
  };
  socket.onerror = () => socket.close();
  socket.onmessage = (message) => {
    let frame;
    try { frame = JSON.parse(message.data); } catch { return; }
    // The command list only arrives with the state, so the ticker was empty until now.
    if (frame.type === "state") { state = { ...state, ...frame.data }; render(); tick(true); }
    else if (frame.type === "patch") { Object.assign(state, frame.data); render(); }
  };
}

// --- Start -----------------------------------------------------------------------------
if (params.get("demo") === "1") {
  state = {
    live: true, started_at: Date.now() / 1000 - 4517, title: "Ultrawide-Test",
    game: "Elden Ring", viewers: 42, last_follower: "Kevin", last_sub: "", last_raid: "",
    deaths: 19,
    commands: [
      { name: "!tode", help: "zeigt den Todeszähler" },
      { name: "!rank", help: "dein Level" },
      { name: "!top", help: "die aktivsten Chatter" },
    ],
  };
}

render();
renderUptime();
renderClock();
tick(true);
setInterval(renderUptime, 1000);
setInterval(renderClock, 10000);
setInterval(tick, 8000);
connect();

// The ring's measurements, so the camera source can be placed on it without guessing.
{
  const ring = $("cam").getBoundingClientRect();
  console.log(`Kamera-Ring: Mitte (${Math.round(ring.x + ring.width / 2)}, ` +
              `${Math.round(ring.y + ring.height / 2)}), Durchmesser ${Math.round(ring.width)} px`);
  console.log("Aussehen ändern: ?t.<token>=<wert>, z.B. ?t.accent=%2356B893 - Liste in README.md");
}
</script>
