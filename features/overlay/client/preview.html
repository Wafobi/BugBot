<meta charset="utf-8">
<title>BugBot Overlay — Preview</title>

<!--
  To see it in a normal browser. Just open:

    file:///path/to/bugbot/features/overlay/client/preview.html

  Why this file exists: bars.html is a fixed 2560x1440 with a transparent background -
  opened directly, all you see is its top-left corner on white, which is no basis for
  judging anything. Here it sits inside a frame that scales to the window size, with a
  game-picture stand-in and a hinted-at camera behind it - exactly the setup it will later
  sit in inside OBS.

  Every bars.html parameter also works here and is passed through:
    preview.html?off=clock&bar=110
-->

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e0f14; color: #cfd6e0; overflow: hidden; height: 100vh;
    font: 14px/1.5 system-ui, sans-serif;
  }

  /* --- Toolbar -------------------------------------------------------------------- */
  #bar {
    position: fixed; inset: 0 0 auto 0; z-index: 10; height: 46px;
    display: flex; align-items: center; gap: 18px; padding: 0 16px;
    background: #16181f; border-bottom: 1px solid #262a34;
  }
  #bar label { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  #bar select, #bar input[type=text] {
    background: #0e0f14; color: #cfd6e0; border: 1px solid #333846;
    border-radius: 5px; padding: 4px 7px; font: inherit;
  }
  #bar input[type=text] { width: 260px; }
  #bar .hint { margin-left: auto; opacity: .5; font-size: 12px; }

  /* --- Stage ---------------------------------------------------------------------- */
  /* safe center: at 100% the stage is bigger than the window - without "safe" the
     centering would cut off at the top and left instead of allowing a scroll. */
  #wrap {
    position: absolute; inset: 46px 0 0 0; overflow: auto;
    display: flex; align-items: safe center; justify-content: safe center;
  }
  #sizer { position: relative; flex: none; }
  #stage {
    position: absolute; top: 0; left: 0; width: 2560px; height: 1440px;
    transform-origin: top left;
    box-shadow: 0 0 0 1px #262a34, 0 18px 60px rgba(0, 0, 0, .6);
  }

  /* The game-picture stand-in: colored and varyingly bright, so it's visible whether the
     bars actually carry it. It ends exactly where the letterboxed picture ends at 1440p. */
  #game {
    position: absolute; left: 0; right: 0; top: var(--bar, 184px); bottom: var(--bar, 184px);
    background:
      radial-gradient(circle at 22% 32%, #6b4b2a 0%, transparent 42%),
      radial-gradient(circle at 74% 62%, #2b4a63 0%, transparent 48%),
      linear-gradient(155deg, #3a3227 0%, #1b232b 55%, #241d29 100%);
  }
  /* The camera - an OBS source *underneath* the overlay, here as a striped pattern. */
  #cam {
    position: absolute; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: repeating-linear-gradient(45deg, #7dd3a0 0 26px, #4aa678 26px 52px);
  }
  #frame {
    position: absolute; inset: 0; width: 2560px; height: 1440px;
    border: 0; background: transparent;
  }
</style>

<div id="bar">
  <label>Bar
    <select id="barh"><option>184</option><option>110</option></select>
  </label>
  <label><input type="checkbox" id="camOn" checked> Camera</label>
  <label>Zoom
    <select id="zoom">
      <option value="fit">fit</option>
      <option value="1">100% (real pixels)</option>
      <option value="0.5">50%</option>
    </select>
  </label>
  <label>extra parameters
    <input type="text" id="extra" placeholder="off=clock,deaths">
  </label>
  <span class="hint">bars.html?demo=1 &middot; every parameter is passed through</span>
</div>

<div id="wrap"><div id="sizer"><div id="stage">
  <div id="game"></div>
  <div id="cam"></div>
  <iframe id="frame"></iframe>
</div></div></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const incoming = new URLSearchParams(location.search);

// Whatever is in the address pre-fills the toolbar - so a link to a specific setup is
// shareable, and the controls still show the right state.
if (incoming.has("bar")) $("barh").value = incoming.get("bar");
if (incoming.get("cam") === "0") $("camOn").checked = false;
{
  const rest = new URLSearchParams(incoming);
  ["bar", "cam", "demo"].forEach((k) => rest.delete(k));
  $("extra").value = decodeURIComponent(rest.toString().replace(/&/g, "&"));
}

function build() {
  const params = new URLSearchParams("demo=1");
  params.set("bar", $("barh").value);
  if (!$("camOn").checked) params.set("cam", "0");

  // Free text after it, so it can override anything set above.
  let query = params.toString();
  const extra = $("extra").value.trim().replace(/^[?&]+/, "");
  if (extra) query += "&" + extra;

  $("frame").src = "bars.html?" + query;

  // Hang the stage and the camera dummy off the same measurements the overlay uses.
  const bar = parseInt($("barh").value, 10) || 184;
  const settings = new URLSearchParams(query);
  const size = parseInt(settings.get("cam"), 10) || 300;
  const x = parseInt(settings.get("camx"), 10) || 230;

  $("stage").style.setProperty("--bar", bar + "px");
  const cam = $("cam");
  const visible = $("camOn").checked && !/(^|[&?])off=[^&]*\bcam\b/.test(query);
  cam.style.display = visible ? "block" : "none";
  // A bit smaller than the ring: the camera sits inside its inner edge.
  cam.style.width = cam.style.height = (size - 10) + "px";
  cam.style.left = x + "px";
  cam.style.top = (1440 - bar) + "px";
}

// Scales to the window size - 2560x1440 otherwise fits in no browser window.
//
// The scaled picture is no good for judging fine lines, though: a 2px line lands on a
// whole or a half pixel boundary depending on the row and gets rounded differently each
// time - two equally thick lines end up looking different thicknesses. That's what the
// "100%" step is for; the window scrolls then.
function fit() {
  const zoom = $("zoom").value;
  const wrap = $("wrap").getBoundingClientRect();
  const scale = zoom === "fit"
    ? Math.min(wrap.width / 2560, wrap.height / 1440) * 0.97
    : parseFloat(zoom);

  $("stage").style.transform = `scale(${scale})`;
  // The placeholder carries the *scaled* size - otherwise the layout would know nothing of
  // the shrinking and would neither center correctly nor scroll at 100%.
  $("sizer").style.width = 2560 * scale + "px";
  $("sizer").style.height = 1440 * scale + "px";
}

for (const id of ["barh", "camOn", "extra"]) {
  $(id).addEventListener(id === "extra" ? "change" : "input", build);
}
$("zoom").addEventListener("input", fit);
addEventListener("resize", fit);
build();
fit();
</script>
