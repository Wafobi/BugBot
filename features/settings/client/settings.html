<!DOCTYPE html>
<!--
  The settings website - served by the bot (features/settings/feature.py) on the overlay
  listener: http://127.0.0.1:4457/settings?token=<SETTINGS_TOKEN> through the SSH tunnel.

  Builds its forms from the JSON files themselves: a switch for true/false, a number field, a
  text field or box, one line per entry for lists, a section per object - and the "_comment"
  keys as help next to what they explain. So a new setting shows up here without anyone
  touching this page. Saves go into the override layer (settings/<name>.json), never into the
  repository's files; "↺" removes an override again, "Rückgängig" puts the previous version
  of the whole file back.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<title>BugBot – Einstellungen</title>
<style>
  /* --cyan is the accent and --magenta the second accent - named after aurora, the default;
     the theme picker (THEMES below) replaces all colour tokens at once. */
  :root {
    --ink: #0f0d18; --ink-2: #15121f; --ink-deep: #08070e; --line: #2a2140; --line-2: #3a2f55;
    --cyan: #5FEAF5; --magenta: #F22A80; --dim: #8a7ba0; --text: #e7e2f2; --green: #7cffb2; --red: #ff5f6d;
    --font: "IBM Plex Mono", ui-monospace, "SFMono-Regular", "Courier New", monospace;
  }
  .theme { margin-top: 22px; padding: 0 6px; font-size: 12px; color: var(--dim); }
  .theme select { width: 100%; margin-top: 6px; font: inherit; color: var(--text); background: var(--ink-2); border: 1px solid var(--line-2); border-radius: 4px; padding: 6px 8px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--ink-deep); color: var(--text); font-family: var(--font); font-size: 13px; display: flex; }
  a { color: var(--cyan); }

  nav { width: 270px; flex-shrink: 0; height: 100%; overflow-y: auto; background: var(--ink); border-right: 1px solid var(--line); padding: 16px 12px; }
  nav h1 { font-size: 17px; color: var(--cyan); margin: 0 0 2px; }
  nav .sub { color: var(--dim); font-size: 11px; margin-bottom: 14px; }
  nav h2 { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .12em; margin: 16px 6px 6px; }
  nav button {
    display: flex; justify-content: flex-start; align-items: center; gap: 6px; width: 100%;
    text-align: left; font: inherit; color: var(--text); background: none; border: 1px solid transparent;
    border-radius: 4px; padding: 6px 8px; cursor: pointer;
  }
  nav button:hover { background: var(--ink-2); }
  nav button.active { border-color: var(--line-2); background: var(--ink-2); color: var(--cyan); }
  nav button .owner { color: var(--dim); font-size: 11px; }
  nav button .dot { color: var(--magenta); margin-left: auto; }
  nav .links { margin-top: 20px; padding: 0 6px; font-size: 12px; line-height: 1.8; }

  main { flex: 1; height: 100%; overflow-y: auto; padding: 18px 26px 80px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: sticky; top: -18px; background: var(--ink-deep); padding: 18px 0 12px; z-index: 2; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  header h2 { margin: 0; font-size: 18px; color: var(--cyan); }
  header .path { color: var(--dim); font-size: 12px; flex: 1; }
  input[type=search] { font: inherit; color: var(--text); background: var(--ink); border: 1px solid var(--line-2); border-radius: 4px; padding: 6px 10px; width: 240px; }
  header button, .add button { font: inherit; font-size: 12px; color: var(--text); background: var(--ink-2); border: 1px solid var(--line-2); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  header button:disabled { opacity: .4; cursor: default; }

  details { border: 1px solid var(--line); border-radius: 6px; margin: 8px 0; background: var(--ink); }
  details > summary { cursor: pointer; padding: 8px 12px; color: var(--cyan); font-weight: 600; list-style: none; display: flex; gap: 8px; align-items: center; }
  details > summary::before { content: "▸"; color: var(--dim); }
  details[open] > summary::before { content: "▾"; }
  details > .body { padding: 2px 12px 10px; }
  details details { background: var(--ink-2); }
  .hint { color: var(--dim); font-size: 12px; margin: 4px 0 8px; line-height: 1.45; white-space: pre-wrap; }

  .row { display: grid; grid-template-columns: minmax(150px, 230px) 1fr auto; gap: 10px; align-items: start; padding: 7px 0; border-top: 1px solid rgba(255,255,255,.04); }
  .row:first-child { border-top: none; }
  .row .key { padding-top: 6px; overflow-wrap: anywhere; }
  .row .key .tags { display: block; margin-top: 3px; }
  .tag { display: inline-block; font-size: 10px; border-radius: 3px; padding: 1px 5px; margin-right: 4px; }
  .tag.changed { background: rgba(242, 42, 128, .18); color: var(--magenta); }
  .tag.new { background: rgba(95, 234, 245, .14); color: var(--cyan); }
  .tag.ph { background: rgba(255,255,255,.06); color: var(--dim); }
  .row input[type=text], .row input[type=number], .row textarea {
    font: inherit; color: var(--text); background: var(--ink-deep); border: 1px solid var(--line-2); border-radius: 4px; padding: 6px 8px; width: 100%;
  }
  .row textarea { min-height: 34px; resize: vertical; line-height: 1.45; }
  .row input[type=checkbox] { width: 18px; height: 18px; margin-top: 6px; accent-color: var(--magenta); }
  .row.changed input, .row.changed textarea { border-color: rgba(242, 42, 128, .55); }
  .row .side { display: flex; gap: 4px; align-items: center; padding-top: 4px; min-width: 60px; }
  .row .side button { font: inherit; background: none; border: none; color: var(--dim); cursor: pointer; font-size: 15px; }
  .row .side button:hover { color: var(--magenta); }
  .row .msg { grid-column: 2 / 4; font-size: 12px; margin-top: -2px; }
  .row .msg.err { color: var(--red); } .row .msg.ok { color: var(--green); }
  .row.readonly input, .row.readonly textarea { opacity: .6; }
  .add { display: flex; gap: 6px; margin-top: 8px; }
  .add input { font: inherit; color: var(--text); background: var(--ink-deep); border: 1px solid var(--line-2); border-radius: 4px; padding: 5px 8px; }
  .add input:first-child { width: 180px; } .add input:nth-child(2) { flex: 1; }
  .hidden { display: none !important; }
  #toast { position: fixed; right: 20px; bottom: 20px; background: var(--ink-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 10px 14px; font-size: 13px; opacity: 0; transition: opacity .2s; }
  #toast.show { opacity: 1; } #toast.err { border-color: var(--red); color: var(--red); } #toast.ok { border-color: var(--green); color: var(--green); }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }
  nav button.child { padding-left: 24px; font-size: 12.5px; }
  nav button.child::before { content: "└"; color: var(--line-2); margin-right: 6px; }
  nav button.off { opacity: .45; }
  #module { margin: -4px 0 14px; }
  #module .desc { color: var(--text); opacity: .85; line-height: 1.5; margin: 0 0 8px; max-width: 900px; }
  #module .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font-size: 11px; border: 1px solid var(--line-2); border-radius: 10px; padding: 2px 8px; color: var(--dim); }
  .badge.on { color: var(--green); border-color: rgba(124,255,178,.35); }
  .badge.off { color: var(--red); border-color: rgba(255,95,109,.35); }
  .badge b { color: var(--text); font-weight: normal; }
  #tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  #tabs button { font: inherit; color: var(--dim); background: none; border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0; padding: 7px 14px; cursor: pointer; }
  #tabs button.active { color: var(--cyan); border-color: var(--line); background: var(--ink); margin-bottom: -1px; }
  #tabs button .dot { color: var(--magenta); }
  iframe.tool { width: 100%; height: calc(100vh - 110px); border: none; background: var(--ink-deep); }
  .toollink { display: inline-block; margin: 0 0 10px; padding: 8px 12px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--ink); cursor: pointer; color: var(--cyan); }
</style>
</head>
<body>
<nav>
  <h1>⚙ BugBot</h1>
  <div class="sub">Einstellungen · <span id="conn">verbinde …</span></div>
  <div id="files"></div>
  <div class="theme">
    Stil
    <select id="theme"></select>
  </div>
</nav>
<main>
  <header>
    <h2 id="title">–</h2>
    <span class="path" id="path"></span>
    <input type="search" id="search" placeholder="suchen … (Strg+K)">
    <button id="undo" title="Die vorherige Version dieser Datei wiederherstellen">↶ Rückgängig</button>
  </header>
  <div id="module"></div>
  <div id="tabs"></div>
  <div id="content"><div class="empty">Modul links auswählen.</div></div>
</main>
<div id="toast"></div>

<script>
(function () {
  "use strict";
  // The token stays in the URL: the page itself is behind it too (GET /settings), so taking it
  // out of the address bar would break reloading and bookmarks.
  var token = new URLSearchParams(location.search).get("token") || "";
  var $ = function (id) { return document.getElementById(id); };

  // current = the settings file being edited (its id, for get/set/reset), state = its data;
  // modules = the bot's modules as the registry has them (see SettingsFeature.modules).
  var socket, nextId = 1, pending = {}, files = [], modules = [], current = null, state = null;
  var currentModule = null, currentTab = null;

  // --- Theme --------------------------------------------------------------------------------
  // The overlays' colour worlds (features/overlay/client/terminal/themes, client/themes). The
  // choice is a setting of the bot (features/settings/settings.json, "theme"), so it is the
  // same in every browser - and undo/reset work on it like on everything else.
  var SETTINGS_FILE = "features/settings/settings.json";
  var THEMES = {
    aurora: { label: "aurora – Cyan & Magenta", ink: "#0f0d18", ink2: "#15121f", deep: "#08070e", line: "#2a2140", line2: "#3a2f55", accent: "#5FEAF5", accent2: "#F22A80", dim: "#8a7ba0", text: "#e7e2f2" },
    amber:  { label: "amber – klassisches Terminal", ink: "#15100a", ink2: "#1c150c", deep: "#0d0904", line: "#2a1f10", line2: "#3d2d17", accent: "#ffb000", accent2: "#ff8fd6", dim: "#8a6a34", text: "#f0e2c4" },
    cyan:   { label: "cyan", ink: "#0a1318", ink2: "#0f1b22", deep: "#050b0e", line: "#183039", line2: "#23434f", accent: "#4FD8FF", accent2: "#8FE8FF", dim: "#5d8a98", text: "#dff6ff" },
    matrix: { label: "matrix – Grün", ink: "#08130a", ink2: "#0c1a0e", deep: "#040904", line: "#15301a", line2: "#1f4626", accent: "#39FF14", accent2: "#7CFF6B", dim: "#4f8a45", text: "#d8ffd0" },
    sunset: { label: "sunset – Orange & Rot", ink: "#1a0f0c", ink2: "#22140f", deep: "#100806", line: "#3a2016", line2: "#52301f", accent: "#FFB000", accent2: "#F2542A", dim: "#a07a66", text: "#ffefd9" },
    mono:   { label: "mono – Schwarzweiß", ink: "#111111", ink2: "#181818", deep: "#0a0a0a", line: "#2a2a2a", line2: "#3a3a3a", accent: "#f5f5f5", accent2: "#bdbdbd", dim: "#8a8a8a", text: "#e8e8e8" },
  };
  var theme = "aurora";
  Object.keys(THEMES).forEach(function (name) {
    var o = document.createElement("option"); o.value = name; o.textContent = THEMES[name].label; $("theme").appendChild(o);
  });
  function themeVars(t) {
    return { "--ink": t.ink, "--ink-2": t.ink2, "--ink-deep": t.deep, "--line": t.line, "--line-2": t.line2,
             "--cyan": t.accent, "--magenta": t.accent2, "--dim": t.dim, "--text": t.text };
  }
  // A tool page (TTS) has its own token names - same colours, mapped onto them.
  function toolVars(t) {
    return { "--ink": t.ink, "--ink-deep": t.deep, "--ink-line": t.line, "--amber": t.accent, "--cyan": t.accent2,
             "--amber-soft": t.text, "--amber-dim": t.dim };
  }
  function setVars(doc, vars) {
    Object.keys(vars).forEach(function (k) { doc.documentElement.style.setProperty(k, vars[k]); });
    if (doc.body) doc.body.style.color = vars["--text"] || vars["--amber-soft"];
  }
  function applyTheme(name) {
    theme = THEMES[name] ? name : "aurora";
    $("theme").value = theme;
    setVars(document, themeVars(THEMES[theme]));
    document.querySelectorAll("iframe.tool").forEach(function (f) {
      if (f.contentDocument) setVars(f.contentDocument, toolVars(THEMES[theme]));
    });
  }
  $("theme").addEventListener("change", function () {
    var name = $("theme").value;
    applyTheme(name);
    call("set", { file: SETTINGS_FILE, path: ["theme"], value: name }).then(function (data) {
      if (current === SETTINGS_FILE) show(data);
      toast("Stil: " + name, "ok");
    }).catch(function (e) { toast(e.message, "err"); });
  });

  // The bridge for tool pages (features offering SETTINGS_TOOL, e.g. TTS): they are shown in a
  // frame and call back through this page's authenticated connection - they have none of
  // their own.
  window.bugbotTool = function (tool, action, args) {
    return call("tool", { tool: tool, action: action, args: args || {} });
  };

  function toast(text, cls) {
    var t = $("toast");
    t.textContent = text; t.className = "show " + (cls || "");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.className = ""; }, 2600);
  }

  // --- Connection -------------------------------------------------------------------------
  function connect() {
    socket = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host +
      "/?role=settings&token=" + encodeURIComponent(token));
    socket.onopen = function () { $("conn").textContent = "verbunden"; $("conn").style.color = "var(--green)"; };
    socket.onclose = function () {
      $("conn").textContent = "getrennt – verbinde neu …"; $("conn").style.color = "var(--red)";
      setTimeout(connect, 3000);
    };
    socket.onmessage = function (message) {
      var frame = JSON.parse(message.data);
      if (frame.type === "theme") applyTheme(frame.data);
      else if (frame.type === "modules") { modules = frame.data; renderNav(); }
      else if (frame.type === "files") {
        files = frame.data;
        if (!currentModule && modules.length) {
          var hash = decodeURIComponent(location.hash.slice(1)).split("/");
          openModule(hash[0], hash[1]);
        }
      }
      else if (frame.type === "reply" && pending[frame.id]) {
        var p = pending[frame.id]; delete pending[frame.id];
        frame.ok ? p.resolve(frame.data) : p.reject(new Error(frame.error));
      }
    };
  }
  function call(op, args) {
    return new Promise(function (resolve, reject) {
      var id = nextId++;
      pending[id] = { resolve: resolve, reject: reject };
      socket.send(JSON.stringify(Object.assign({ id: id, op: op }, args || {})));
    });
  }

  // --- Modules ------------------------------------------------------------------------------
  // The navigation is the bot: each platform with the features it owns underneath, then the
  // neutral features - exactly as the registry loaded them. A module's page has a tab for its
  // settings file (if it has one) and one per tool page it brings along.
  function moduleById(id) { return modules.find(function (m) { return m.id === id; }); }

  function renderNav() {
    var box = $("files");
    box.innerHTML = "";
    function button(m, child) {
      var b = document.createElement("button");
      b.className = (currentModule === m.id ? "active " : "") + (child ? "child " : "") + (m.loaded ? "" : "off");
      var label = document.createElement("span"); label.textContent = m.name; b.appendChild(label);
      if (!m.loaded) b.title = "nicht geladen";
      if (m.overridden) { var d = document.createElement("span"); d.className = "dot"; d.textContent = "●"; d.title = "hat eigene Änderungen"; b.appendChild(d); }
      b.addEventListener("click", function () { openModule(m.id); });
      box.appendChild(b);
    }
    var h = document.createElement("h2"); h.textContent = "Plattformen"; box.appendChild(h);
    modules.forEach(function (m) {
      if (m.kind === "platform") button(m, false);
      else if (m.owner) button(m, true);
    });
    h = document.createElement("h2"); h.textContent = "Features"; box.appendChild(h);
    modules.filter(function (m) { return m.kind === "feature" && !m.owner; }).forEach(function (m) { button(m, false); });
  }

  function tabsOf(m) {
    var tabs = [];
    if (m.config) tabs.push({ id: "settings", label: "⚙ Einstellungen" });
    (m.tools || []).forEach(function (t) { tabs.push({ id: "tool:" + t.id, label: (t.icon ? t.icon + " " : "") + t.title, tool: t }); });
    return tabs;
  }

  function renderModuleInfo(m) {
    var box = $("module");
    box.innerHTML = "";
    if (m.description) { var p = document.createElement("p"); p.className = "desc"; p.textContent = m.description; box.appendChild(p); }
    var badges = document.createElement("div"); badges.className = "badges";
    function badge(text, cls, strong) {
      var b = document.createElement("span"); b.className = "badge " + (cls || "");
      b.textContent = text;
      if (strong) { var s = document.createElement("b"); s.textContent = " " + strong; b.appendChild(s); }
      badges.appendChild(b);
    }
    badge(m.kind === "platform" ? "Plattform" : (m.owner ? "Feature von " + m.owner : "Feature"));
    badge(m.loaded ? "geladen" : "nicht geladen", m.loaded ? "on" : "off");
    if ((m.capabilities || []).length) badge("kann:", "", m.capabilities.join(", "));
    if ((m.provides || []).length) badge("bietet:", "", m.provides.join(", "));
    if ((m.requires || []).length) badge("braucht:", "", m.requires.join(", "));
    if ((m.optional || []).length) badge("nutzt, wenn da:", "", m.optional.join(", "));
    box.appendChild(badges);
  }

  function openModule(id, tabId) {
    var m = moduleById(id) || modules[0];
    if (!m) return;
    currentModule = m.id;
    renderNav();
    $("title").textContent = m.name;
    $("path").textContent = m.path || "";
    renderModuleInfo(m);
    var tabs = tabsOf(m);
    var tab = tabs.find(function (t) { return t.id === tabId; }) || tabs[0];
    currentTab = tab ? tab.id : null;
    history.replaceState(null, "", location.pathname + location.search + "#" + m.id + (tab ? "/" + tab.id : ""));
    var bar = $("tabs");
    bar.innerHTML = "";
    bar.classList.toggle("hidden", tabs.length < 2);
    tabs.forEach(function (t) {
      var b = document.createElement("button");
      b.className = t.id === currentTab ? "active" : "";
      b.textContent = t.label;
      b.addEventListener("click", function () { openModule(m.id, t.id); });
      bar.appendChild(b);
    });
    var editing = !!tab && tab.id === "settings";
    $("search").classList.toggle("hidden", !editing); $("undo").classList.toggle("hidden", !editing);
    current = null; state = null;
    if (!tab) {
      $("content").innerHTML = '<div class="empty">' + (m.loaded ? "Dieses Modul hat keine Einstellungen." : "Dieses Modul ist nicht geladen.") + "</div>";
      return;
    }
    if (tab.tool) return openTool(tab.tool);
    current = m.config;
    $("content").innerHTML = '<div class="empty">lade …</div>';
    return call("get", { file: m.config }).then(show).catch(function (e) { toast(e.message, "err"); });
  }

  function openTool(tool) {
    $("content").innerHTML = '<div class="empty">lade …</div>';
    return call("tool", { tool: tool.id, action: "page" }).then(function (data) {
      var frame = document.createElement("iframe");
      frame.className = "tool";
      frame.addEventListener("load", function () { setVars(frame.contentDocument, toolVars(THEMES[theme])); });
      frame.srcdoc = data.html;
      $("content").innerHTML = ""; $("content").appendChild(frame);
    }).catch(function (e) { $("content").innerHTML = ""; toast(e.message, "err"); });
  }

  function show(data) {
    state = data;
    // The theme is a setting like any other - edited in the form, it applies right away.
    if (data.file === SETTINGS_FILE) {
      var chosen = at(data.overrides, ["theme"]);
      applyTheme(chosen !== undefined ? chosen : data.base.theme);
    }
    var owner = modules.find(function (m) { return m.config === data.file; });
    if (owner) {
      var was = owner.overridden;
      owner.overridden = Object.keys(data.overrides).length > 0;
      if (was !== owner.overridden) renderNav();
    }
    $("path").textContent = data.file + (data.read_only ? "  · nur lesbar" : "") +
      (Object.keys(data.overrides).length ? "  · eigene Änderungen in settings/" + data.file.split("/").pop() : "");
    $("undo").disabled = !data.history.length;
    var content = $("content");
    var scroll = document.querySelector("main").scrollTop;
    var openPaths = Array.from(content.querySelectorAll("details[open]")).map(function (d) { return d.dataset.path; });
    content.innerHTML = "";
    renderDict(data.base, data.overrides, [], content, openPaths, true);
    applySearch();
    document.querySelector("main").scrollTop = scroll;
  }

  // --- Building the form from the JSON -------------------------------------------------------
  function at(obj, path) {
    var node = obj;
    for (var i = 0; i < path.length; i++) {
      if (node === null || typeof node !== "object" || Array.isArray(node) || !(path[i] in node)) return undefined;
      node = node[path[i]];
    }
    return node;
  }
  function kind(v) {
    if (v === null || v === undefined) return "null";
    if (Array.isArray(v)) return "list";
    return typeof v === "object" ? "dict" : typeof v;
  }
  function hasOverrideUnder(path) {
    var v = at(state.overrides, path);
    return v !== undefined && !(kind(v) === "dict" && Object.keys(v).length === 0);
  }
  function placeholders(text) {
    var found = [], re = /\{([^{}]+)\}/g, m;
    while ((m = re.exec(text || ""))) if (found.indexOf(m[1]) === -1) found.push(m[1]);
    return found;
  }

  function renderDict(base, overrides, path, container, openPaths, top) {
    var keys = Object.keys(base || {});
    var extra = Object.keys(at(overrides, path) && kind(at(overrides, path)) === "dict" ? at(overrides, path) : {})
      .filter(function (k) { return keys.indexOf(k) === -1; });
    keys.concat(extra).forEach(function (key) {
      var childPath = path.concat(key);
      var shipped = base ? base[key] : undefined;
      if (key.charAt(0) === "_") {
        if (typeof shipped === "string") {
          var hint = document.createElement("div"); hint.className = "hint"; hint.textContent = shipped;
          hint.dataset.search = shipped.toLowerCase();
          container.appendChild(hint);
        }
        return;
      }
      if (kind(shipped) === "dict") {
        var d = document.createElement("details");
        d.dataset.path = childPath.join(".");
        d.open = top ? Object.keys(shipped).length <= 12 || openPaths.indexOf(d.dataset.path) !== -1 : openPaths.indexOf(d.dataset.path) !== -1;
        var s = document.createElement("summary");
        s.textContent = key;
        if (hasOverrideUnder(childPath)) { var t = document.createElement("span"); t.className = "tag changed"; t.textContent = "geändert"; s.appendChild(t); }
        d.appendChild(s);
        var body = document.createElement("div"); body.className = "body";
        renderDict(shipped, overrides, childPath, body, openPaths, false);
        maybeAdd(shipped, childPath, body);
        d.appendChild(body);
        container.appendChild(d);
      } else {
        container.appendChild(renderRow(key, shipped, childPath, extra.indexOf(key) !== -1));
      }
    });
  }

  // "+ Eintrag" only where the bot accepts new keys: a plain name -> text table.
  function maybeAdd(shipped, path, body) {
    if (state.read_only || path[path.length - 1] === "texts") return;
    var values = Object.keys(shipped).filter(function (k) { return k.charAt(0) !== "_"; }).map(function (k) { return shipped[k]; });
    if (!values.length || !values.every(function (v) { return typeof v === "string"; })) return;
    var add = document.createElement("div"); add.className = "add";
    add.innerHTML = '<input placeholder="neuer Name, z.B. !hallo"><input placeholder="Text"><button>＋ hinzufügen</button>';
    add.querySelector("button").addEventListener("click", function () {
      var k = add.children[0].value.trim(), v = add.children[1].value;
      if (!k) return;
      save(path.concat(k), v);
    });
    body.appendChild(add);
  }

  function renderRow(key, shipped, path, isNew) {
    var override = at(state.overrides, path);
    var changed = override !== undefined;
    var value = changed ? override : shipped;
    var row = document.createElement("div");
    row.className = "row" + (changed ? " changed" : "") + (state.read_only ? " readonly" : "");
    row.dataset.search = (path.join(".") + " " + JSON.stringify(value)).toLowerCase();

    var label = document.createElement("div"); label.className = "key"; label.textContent = key;
    var tags = document.createElement("span"); tags.className = "tags";
    if (changed) tags.innerHTML += '<span class="tag ' + (isNew ? "new" : "changed") + '">' + (isNew ? "neu" : "geändert") + "</span>";
    if (typeof shipped === "string") placeholders(shipped).forEach(function (p) {
      var t = document.createElement("span"); t.className = "tag ph"; t.textContent = "{" + p + "}"; tags.appendChild(t);
    });
    label.appendChild(tags);
    row.appendChild(label);

    var input, read;
    var type = kind(shipped === undefined ? value : shipped);
    if (type === "boolean") {
      input = document.createElement("input"); input.type = "checkbox"; input.checked = !!value;
      read = function () { return input.checked; };
      input.addEventListener("change", function () { commit(); });
    } else if (type === "number") {
      input = document.createElement("input"); input.type = "number"; input.step = "any"; input.value = value;
      read = function () { var n = parseFloat(input.value); if (isNaN(n)) throw new Error("keine Zahl"); return n; };
    } else if (type === "list" && (value || []).every(function (v) { return typeof v === "string" || typeof v === "number"; })) {
      var numeric = (shipped || value || []).length && (shipped || value).every(function (v) { return typeof v === "number"; });
      input = document.createElement("textarea"); input.value = (value || []).join("\n");
      input.rows = Math.min(12, Math.max(2, (value || []).length + 1));
      input.title = "ein Eintrag pro Zeile";
      read = function () {
        return input.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean)
          .map(function (s) { return numeric ? parseFloat(s) : s; });
      };
    } else if (type === "string" || type === "null" && typeof value === "string") {
      var long = String(value).length > 60 || String(value).indexOf("\n") !== -1 || path.indexOf("texts") !== -1;
      input = document.createElement(long ? "textarea" : "input");
      if (!long) input.type = "text";
      input.value = value === null ? "" : value;
      if (long) input.rows = Math.min(8, Math.max(1, Math.ceil(String(value).length / 90)));
      read = function () { return input.value; };
    } else if (type === "null") {
      // Shipped empty ("null" = use the default) - any value may go in; empty means default.
      input = document.createElement("input"); input.type = "text";
      input.value = value === null || value === undefined ? "" : (typeof value === "string" ? value : JSON.stringify(value));
      input.placeholder = "leer = Standard";
      read = function () {
        var raw = input.value.trim();
        if (raw === "") return null;
        try { return JSON.parse(raw); } catch (e) { return raw; }
      };
    } else {
      input = document.createElement("textarea"); input.value = JSON.stringify(value, null, 2);
      input.rows = Math.min(14, input.value.split("\n").length);
      input.title = "JSON";
      read = function () { return JSON.parse(input.value); };
    }
    if (state.read_only) input.disabled = true;
    row.appendChild(input);

    var side = document.createElement("div"); side.className = "side";
    if (changed && !state.read_only) {
      var reset = document.createElement("button"); reset.textContent = "↺";
      reset.title = isNew ? "Eintrag entfernen" : "Auf Standard zurücksetzen: " + JSON.stringify(shipped);
      reset.addEventListener("click", function () { resetPath(path); });
      side.appendChild(reset);
    }
    row.appendChild(side);
    var msg = document.createElement("div"); msg.className = "msg"; row.appendChild(msg);

    function commit() {
      var next;
      try { next = read(); } catch (e) { msg.textContent = e.message; msg.className = "msg err"; return; }
      if (JSON.stringify(next) === JSON.stringify(value)) return;
      if (next === null && type === "null") { if (changed) resetPath(path); return; }
      save(path, next, msg);
    }
    if (type !== "boolean") {
      input.addEventListener("blur", commit);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && (input.tagName === "INPUT" || e.ctrlKey || e.metaKey)) { e.preventDefault(); input.blur(); }
        if (e.key === "Escape") { input.value = type === "list" ? (value || []).join("\n") : (typeof value === "object" ? JSON.stringify(value, null, 2) : value); input.blur(); }
      });
    }
    return row;
  }

  function save(path, value, msg) {
    return call("set", { file: current, path: path, value: value }).then(function (data) {
      show(data); toast("Gespeichert: " + path.join("."), "ok");
    }).catch(function (e) {
      if (msg) { msg.textContent = e.message; msg.className = "msg err"; }
      toast(e.message, "err");
    });
  }
  function resetPath(path) {
    return call("reset", { file: current, path: path }).then(function (data) {
      show(data); toast("Zurückgesetzt: " + path.join("."), "ok");
    }).catch(function (e) { toast(e.message, "err"); });
  }

  // --- Search -------------------------------------------------------------------------------
  function applySearch() {
    var q = $("search").value.trim().toLowerCase();
    var content = $("content");
    content.querySelectorAll(".row, .hint").forEach(function (el) {
      el.classList.toggle("hidden", !!q && el.dataset.search.indexOf(q) === -1);
    });
    content.querySelectorAll("details").forEach(function (d) {
      var any = !q || d.querySelector(".row:not(.hidden)");
      d.classList.toggle("hidden", !any);
      if (q && any) d.open = true;
    });
  }
  $("search").addEventListener("input", applySearch);
  document.addEventListener("keydown", function (e) {
    if (e.key === "k" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $("search").focus(); }
  });
  $("undo").addEventListener("click", function () {
    if (!state || !state.history.length) return;
    call("restore", { file: current, version: state.history[0] }).then(function (data) {
      show(data); toast("Vorherige Version wiederhergestellt", "ok");
    }).catch(function (e) { toast(e.message, "err"); });
  });

  if (!token) { $("content").innerHTML = '<div class="empty">Kein ?token= in der URL (SETTINGS_TOKEN).</div>'; return; }
  connect();
})();
</script>
</body>
</html>
